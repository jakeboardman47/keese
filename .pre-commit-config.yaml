# Fail fast; run in sensible order. Install with:
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg

repos:
  # ==================== General checks ====================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.secrets\.baseline$
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^\.plan-logs/
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: detect-private-key
        exclude: (_test\.|^test/)
      - id: mixed-line-ending

  # ==================== Secrets scan ====================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (^\.secrets\.baseline$|^go\.sum$|^\.gitignore$|^flake\.lock$|^\.plan-logs/)

  # ==================== Shell ====================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # -S error: only fail on errors; warnings/info/style surface via
        # code review and the P3 hardened-hooks phase. -x: follow sourced
        # files. Exclude .envrc — it's a direnv file, not a stand-alone
        # script, and shellcheck can't detect shell without a shebang.
        args: ["-x", "-S", "error"]
        exclude: ^\.envrc$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-bn", "-w"]

  # ==================== Markdown ====================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

  # ==================== Diagram freshness ====================
  # Re-renders every committed diagram source and blocks commits where the
  # rendered SVG has drifted from the source. Sources supported: *.d2, *.mmd, *.dot.
  - repo: local
    hooks:
      - id: diagram-freshness
        name: Diagram freshness (source ↔ render)
        entry: scripts/check-diagram-freshness.sh
        language: system
        pass_filenames: false
        files: ^(docs|book)/.*\.(d2|mmd|dot|svg)$

  # ==================== License / SPDX headers ====================
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        name: Verify SPDX + copyright headers
        args:
          - "-check"
          - "-c"
          - "keese-ai"
          - "-l"
          - "apache"
          - "-ignore"
          - "**/*.md"
          - "-ignore"
          - "**/*.json"
          - "-ignore"
          - "**/go.sum"
          - "-ignore"
          - "LICENSE"
          - "-ignore"
          - "CODEOWNERS"
          - "-ignore"
          - "book/**"
          - "-ignore"
          - ".plan-logs/**"
          - "-ignore"
          - "**/*.toml"
          - "-ignore"
          - "flake.lock"

  # ==================== Commit message (Conventional Commits) ====================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ==================== Optional: gitleaks as a belt-and-suspenders check ====================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ==================== Go (fast) ====================
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: bash -c 'command -v gofumpt >/dev/null && gofumpt -w "$@" || true' --
        language: system
        types: [go]
      - id: goimports
        name: goimports (local=keese)
        entry: bash -c 'command -v goimports >/dev/null && goimports -w -local github.com/keese-ai/keese "$@" || true' --
        language: system
        types: [go]
      - id: go-mod-tidy
        name: go mod tidy (drift check)
        entry: bash -c 'test -f go.mod && go mod tidy -diff || true'
        language: system
        pass_filenames: false
        files: (go\.mod|go\.sum|\.go)$

  # ==================== Go (slow; diff-scoped) ====================
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (diff-scoped)
        entry: bash -c 'test -f go.mod && command -v golangci-lint >/dev/null && golangci-lint run --new-from-rev=HEAD~1 || true'
        language: system
        pass_filenames: false
        files: \.go$
      - id: govulncheck
        name: govulncheck (pre-push)
        entry: bash -c 'test -f go.mod && command -v govulncheck >/dev/null && govulncheck ./... || true'
        language: system
        pass_filenames: false
        stages: [pre-push]

  # ==================== Kubernetes manifests ====================
  - repo: local
    hooks:
      - id: controller-gen-freshness
        name: controller-gen freshness (no drift after make manifests generate)
        entry: scripts/check-controller-gen.sh
        language: system
        pass_filenames: false
        files: ^(api/|PROJECT|go\.mod)$
      - id: kubeconform
        name: kubeconform (config/ + bundle/)
        entry: scripts/check-kubeconform.sh
        language: system
        pass_filenames: false
        files: ^(config/|bundle/manifests/)
      - id: pluto
        name: pluto (deprecated K8s APIs)
        entry: bash -c 'command -v pluto >/dev/null && test -d config && pluto detect-files -d config/ --target-versions k8s=v1.30.0,k8s=v1.31.0 || true'
        language: system
        pass_filenames: false
        files: ^config/
      - id: kustomize-overlays
        name: kustomize build (dry-run every overlay)
        entry: scripts/check-kustomize-overlays.sh
        language: system
        pass_filenames: false
        files: ^config/
      - id: crd-validation
        name: CRD sample validation (envtest --dry-run=server)
        entry: scripts/check-crd-validation.sh
        language: system
        pass_filenames: false
        files: ^(config/crd/|config/samples/|api/)
      - id: rebac-markers
        name: ReBAC tuple marker presence on authz-affecting CRD fields
        entry: scripts/check-rebac-markers.sh
        language: system
        pass_filenames: false
        files: ^api/.*_types\.go$
      - id: netpol-wildcards
        name: NetworkPolicy wildcard check
        entry: scripts/check-netpol-wildcards.sh
        language: system
        pass_filenames: false
        files: (NetworkPolicy|networking\.k8s\.io).*\.ya?ml$
      - id: signal-handling
        name: SIGTERM handler present in every cmd/** binary
        entry: scripts/check-signal-handling.sh
        language: system
        pass_filenames: false
        files: ^cmd/

  # ==================== OLM bundle ====================
  - repo: local
    hooks:
      - id: bundle-validate
        name: operator-sdk bundle validate
        entry: bash -c 'test -d bundle && command -v operator-sdk >/dev/null && operator-sdk bundle validate ./bundle --select-optional suite=operatorframework || true'
        language: system
        pass_filenames: false
        files: ^bundle/

  # ==================== OpenTofu (cloud deploy) ====================
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt -check -recursive
        entry: bash -c 'test -d deploy/opentofu && command -v tofu >/dev/null && tofu fmt -check -recursive deploy/opentofu || true'
        language: system
        pass_filenames: false
        files: ^deploy/opentofu/.*\.(tf|tofu)$
      - id: tofu-validate
        name: tofu validate each module
        entry: scripts/check-tofu-validate.sh
        language: system
        pass_filenames: false
        files: ^deploy/opentofu/.*\.(tf|tofu)$
      - id: conftest-tofu
        name: conftest test (OPA rego policy)
        entry: bash -c 'test -d policy/opentofu && command -v conftest >/dev/null && conftest test deploy/opentofu -p policy/opentofu || true'
        language: system
        pass_filenames: false
        files: ^(deploy/opentofu/|policy/opentofu/).*\.(tf|tofu|rego)$

  # ==================== YAML ====================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]
        files: ^(config/|bundle/|dev/|deploy/)

  # ==================== Placeholder verification ====================
  - repo: local
    hooks:
      - id: verify-placeholders
        name: verify no template placeholders remain
        entry: scripts/verify-placeholders.sh
        language: system
        pass_filenames: false
