#
# One-shot trigger of the weather agent — exactly the Pod the
# Workflow/WorkflowRun controllers will spawn once the trigger
# projections (CronJob / NATSSubscription / KEDA / Knative) ship
# (currently TD-P2-02 in docs/plans/demo/tech-debt.md).
#
# Apply with:
#   kubectl apply -f dev/demo/weather-agent-job.yaml
#   kubectl wait -n alpha --for=condition=complete job/weather-agent-run --timeout=120s
#   kubectl logs -n alpha job/weather-agent-run
#
# This Job mirrors the long-lived WorkspaceSession pod's mounts so the
# same in-cluster gateway path exercises (BSP credential injection,
# trust-manager-issued CA, no API key on the agent side). Difference:
# the container exits after `goose run --recipe` returns, so stdout
# captures the LLM reply for kubectl logs.
apiVersion: batch/v1
kind: Job
metadata:
  name: weather-agent-run
  namespace: alpha
  labels:
    keese.ai/workflow: weather-agent
    keese.ai/trigger-source: manual
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        keese.ai/workflow: weather-agent
    spec:
      restartPolicy: Never
      # SA is generated by the Workspace controller as ksa-<workspace-UID>;
      # the same SA the long-lived session pod uses. We resolve it via the
      # workspace's status (or kubectl get sa -n alpha) before applying.
      # The trigger projection in TD-P2-02 will read this from the parent
      # Workspace.status automatically.
      serviceAccountName: ksa-abcba018-3e10-48bf-9544-6223ced286b6
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: keese-egress-alpha
                  expirationSeconds: 600
                  path: egress
        - name: scratch
          emptyDir: { sizeLimit: 256Mi }
        - name: gateway-ca
          configMap:
            name: keese-aigateway-ca   # mirrored by the WorkspaceSession reconciler
            optional: true
        - name: recipe
          configMap:
            name: weather-agent
        - name: home
          emptyDir: { sizeLimit: 64Mi }
      containers:
        - name: agent
          image: ghcr.io/block/goose:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/goose"]
          args: ["run", "--recipe", "/var/run/keese/recipes/recipe.yaml"]
          env:
            - name: GOOSE_PROVIDER
              value: anthropic
            - name: GOOSE_MODEL
              value: claude-opus-4-7
            - name: ANTHROPIC_HOST
              value: https://envoy-ai-gateway.keese-system.svc:443
            - name: ANTHROPIC_BASE_URL
              value: https://envoy-ai-gateway.keese-system.svc:443
            - name: ANTHROPIC_API_KEY
              # The BSP injects the real key at the gateway. Goose
              # only needs *some* value to start.
              value: placeholder-bsp-injects-real-one
            - name: SSL_CERT_FILE
              value: /var/run/keese/ca/ca.crt
            - name: HOME
              value: /home/goose
          volumeMounts:
            - { name: sa-token,    mountPath: /var/run/keese/tokens, readOnly: true }
            - { name: scratch,     mountPath: /tmp }
            - { name: gateway-ca,  mountPath: /var/run/keese/ca,      readOnly: true }
            - { name: recipe,      mountPath: /var/run/keese/recipes, readOnly: true }
            - { name: home,        mountPath: /home/goose }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
