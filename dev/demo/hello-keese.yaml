#
# End-to-end demo manifest. Apply order is preserved within a single
# kubectl apply via owner-aware ordering on resource creation.
#
# Apply with:
#   kubectl create namespace alpha   # if not already present
#   kubectl apply -f dev/demo/hello-keese.yaml
#
# Expected outcome:
#   kubectl get tenant,agentruntime,workspace,memory,workspacesession -A
#   → all rows show Ready=True (or progressing toward it)
#
# This file does NOT assume the helmfile bootstrap stack is installed.
# Without OpenFGA / NATS / Envoy AI Gateway the Workspace controller still
# creates the SA + NetworkPolicies + PVC; ReBAC tuple writes go to the
# in-memory FakeRebacWriter (TD-P1-01).

# ── Tenant ───────────────────────────────────────────────────────────
apiVersion: keese.ai/v1alpha1
kind: Tenant
metadata:
  name: alpha
spec:
  adminSubjects:
    - kind: User
      name: alice@example.com
---
# ── AgentRuntime (cluster-scoped) ────────────────────────────────────
# goose-runtime:dev = upstream ghcr.io/block/goose:latest with keese-drain
# baked in at /usr/local/bin/keese-drain (see Dockerfile.goose-runtime).
# Build + load with: make goose-runtime-load
apiVersion: keese.ai/v1alpha1
kind: AgentRuntime
metadata:
  name: goose-default
spec:
  implementation:
    goose:
      image: ghcr.io/keese-ai/goose-runtime:dev
---
# ── Workspace ────────────────────────────────────────────────────────
apiVersion: keese.ai/v1alpha1
kind: Workspace
metadata:
  name: my-ws
  namespace: alpha
spec:
  runtimeRef:
    name: goose-default
  tenantRef:
    name: alpha
  interactive: true
  sessionMode: OnDemand
  concurrencyPolicy: Allow
  # Egress authz allowlist — keese-authz ext_authz Check resolves
  # `tool:<name>#can_call@<subject>` per request and grants only
  # the tools listed here. The Workspace controller writes one
  # `tool:<name>#allowed_in@workspace:<wsuid>` tuple per entry.
  # See dev/bootstrap/aigateway/keese-toolbindings.yaml for the
  # cluster-scoped ToolBinding catalogue that defines these names.
  egress:
    allowedTools:
      # Bare tool name covers requests where Envoy isn't buffering
      # the body for ext_authz, so the bodyDiscriminator can't fire.
      # Sub-tools below cover the discriminator-fired case (when body
      # buffering is wired via SecurityPolicy.spec.extAuth.grpc body
      # forwarding — TD-P1-03 follow-on).
      - anthropic.messages
      - anthropic.messages.opus-4
      - anthropic.messages.sonnet-4
      - anthropic.messages.haiku-4
---
# ── Memory (sqlite) ──────────────────────────────────────────────────
apiVersion: keese.ai/v1alpha1
kind: Memory
metadata:
  name: my-ws-memory
  namespace: alpha
spec:
  workspaceRef: my-ws
  provider:
    type: sqlite
    sqlite:
      storageSize: "2Gi"
      reclaimPolicy: Retain
  embeddingDim: 768
---
# ── WorkspaceSession (per-user) ──────────────────────────────────────
apiVersion: keese.ai/v1alpha1
kind: WorkspaceSession
metadata:
  name: my-session
  namespace: alpha
spec:
  workspaceRef: my-ws
  attachSubject: "user:alice@example.com"
  sessionName: default
  mode: per-user
