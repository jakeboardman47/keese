#
# OpenBao values for local dev — PVC-backed, 1-node, auto-unseal disabled.
# Manual unseal provides dev parity with production where Shamir shares or
# cloud KMS are used. Seed script (dev/bootstrap/openbao/seed.sh) enables
# kv-v2 and writes placeholder secrets after manual unseal.
#
# Refs: docs/designs/11-secrets-pluggable-vault.md

server:
  # Run as a proper server (not dev mode) for parity with prod behaviour.
  dev:
    enabled: false

  # Single-node HA disabled — Raft requires at least 3 nodes for quorum.
  ha:
    enabled: false

  # Standalone mode with PVC-backed storage.
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/openbao/data"
      }

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

  dataStorage:
    enabled: true
    size: 2Gi
    accessMode: ReadWriteOnce

  # Auto-unseal is intentionally disabled for dev parity with prod.
  # Run: kubectl exec -n openbao openbao-0 -- bao operator init
  #      kubectl exec -n openbao openbao-0 -- bao operator unseal <key>
  # Then run scripts/dev/seed-openbao.sh.

ui:
  enabled: true
  serviceType: ClusterIP
