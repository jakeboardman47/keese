#
# OpenBao values for **local dev** — dev-mode (auto-unseal, in-memory).
# Production deployments require manual Shamir unseal or cloud KMS auto-unseal
# and PVC-backed storage; see openbao-prod.yaml.example for the prod template.
#
# Why dev mode here:
#   - Auto-unseal on every restart so `make bootstrap-infra` / `tilt up` / kind
#     re-creates work end-to-end without operator-init + unseal-key handling.
#   - In-memory storage. Data is lost on pod restart — acceptable for dev,
#     since seed.sh re-populates kv-v2 paths on every Tilt loop.
#   - Well-known dev root token (`root`) so the seed script can authenticate
#     without interactive input.
#
# Refs: docs/designs/11-secrets-pluggable-vault.md
#       https://openbao.org/docs/concepts/dev-server

server:
  dev:
    enabled: true
    devRootToken: "root"

  # Disable HA in dev — single-node, in-memory.
  ha:
    enabled: false
  standalone:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

  # In dev mode storage is in-memory; no PVC is required.
  dataStorage:
    enabled: false

ui:
  enabled: true
  serviceType: ClusterIP
