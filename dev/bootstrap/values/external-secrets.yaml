#
# ExternalSecrets Operator values — controller + webhook + cert-controller.
# Cert-manager issues the webhook TLS certificate via the cert-manager
# integration (certManager.enabled: true).
#
# ExternalSecret CRs in dev reference the ClusterSecretStore backed by
# OpenBao to project tenant credentials into K8s Secrets consumed by
# Envoy AI Gateway BackendSecurityPolicy.
#
# Refs: docs/designs/11-secrets-pluggable-vault.md

installCRDs: true

# All three components enabled.
controller:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

webhook:
  enabled: true
  certManager:
    enabled: true
    addInjectorAnnotations: true
    cert:
      create: true
      issuerRef:
        name: selfsigned-cluster-issuer
        kind: ClusterIssuer
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

certController:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
