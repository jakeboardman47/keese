#
# cert-manager values for local dev. CRDs installed via the chart
# (installCRDs: true). A self-signed ClusterIssuer is seeded after
# cert-manager is healthy; downstream issuers (openfga, openbao, etc.)
# are created by their respective helmfile releases.

# `installCRDs: true` was deprecated in cert-manager v1.15+ in favor of
# `crds.enabled`. Both are accepted on the v1.15.3 chart but only `crds`
# is forward-compatible.
crds:
  enabled: true

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Prometheus ServiceMonitor (disabled — dev stack uses ECK, not Prom)
prometheus:
  enabled: false

# Note: a cluster-wide selfsigned-cluster-issuer was previously inlined
# here via extraObjects, but that creates a chicken-and-egg problem on
# first install (the ClusterIssuer is rendered before its CRD lands).
# The aigateway stack creates its own namespaced Issuer
# (dev/bootstrap/aigateway/anthropic-llm-stack.yaml §3) so the
# cluster-scoped one is unnecessary for the demo path. If a downstream
# release needs a ClusterIssuer, apply it via a separate kustomize
# resource that depends on `cert-manager` being healthy.
