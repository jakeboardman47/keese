#
# Kustomize overlay for the OpenFGA seed resources.
# Used by the Tiltfile: k8s_yaml(kustomize('dev/bootstrap/openfga/seed'))
# NOTE: Tiltfile references 'dev/bootstrap/openfga/seed' — this file lives
# in the parent dir and acts as the entry point for kustomize.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - seed.yaml

configMapGenerator:
  - name: openfga-model-fga
    namespace: openfga
    behavior: merge
    files:
      - model.fga

generatorOptions:
  disableNameSuffixHash: true
