#
# Namespace for keese gateway + bootstrap CRs. The operator deploys
# into this namespace via the OLM bundle; the AI Gateway stack also
# lives here so BSP/AIGatewayRoute references stay local (no
# ReferenceGrant required).
apiVersion: v1
kind: Namespace
metadata:
  name: keese-system
  labels:
    kubernetes.io/metadata.name: keese-system
    keese.ai/bootstrap: "true"
