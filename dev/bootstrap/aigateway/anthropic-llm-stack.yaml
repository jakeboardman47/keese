#
# Anthropic LLM stack — single-tenant demo path.
# Routes agent egress through Envoy AI Gateway to api.anthropic.com,
# injecting the API key from OpenBao via ExternalSecrets.
#
# Reference: docs/designs/05a-envoy-ai-gateway-topology.md,
#            docs/designs/05b-credential-injection-patterns.md,
#            docs/designs/05b-ii-bsp-examples.md §static-api-key.
#
# Known caveat (TD-P2-13): the AI Gateway BSP APIKey type injects
# `Authorization: Bearer <key>` whereas Anthropic expects
# `x-api-key: <key>`. For the demo this still proves the routing path;
# the production fix is an HTTPRouteFilter or Lua filter that copies
# Authorization → x-api-key on egress.
#
# Apply with: kubectl apply -f dev/bootstrap/aigateway/

# ── 1. ExternalSecret pulling the key from OpenBao ──────────────────
# OpenBao path keese/tenants/tenant-a/anthropic (created by seed.sh)
# must be populated with the real key before this syncs:
#   bao kv put -mount=keese tenants/tenant-a/anthropic api_key=$ANTHROPIC_API_KEY
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: anthropic-api-key
  namespace: keese-system
  labels:
    keese.ai/bootstrap: "true"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: keese-openbao
    kind: ClusterSecretStore
  target:
    name: anthropic-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: tenants/tenant-a/anthropic
        property: api_key
---
# ── 2. Gateway listener for in-cluster agent egress ─────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: keese-aigateway
  namespace: keese-system
  labels:
    keese.ai/bootstrap: "true"
spec:
  gatewayClassName: envoy-gateway
  listeners:
    # No hostname constraint — accept any SNI. Agent pods reach the
    # gateway via the cluster-local Service alias, but TLS SNI may be
    # rewritten by the resolver to the underlying generated service
    # name (causing `filter_chain_not_found` if we pin a hostname).
    # Cert SANs cover both names; listener is permissive.
    - name: aigw-https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: aigw-server-tls
      allowedRoutes:
        namespaces:
          from: All
---
# ── 3. cert-manager-issued serving cert for the listener ────────────
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: keese-aigw-selfsigned
  namespace: keese-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aigw-server-tls
  namespace: keese-system
spec:
  secretName: aigw-server-tls
  duration: 8760h     # 1 year for demo; rotate via cert-manager in prod
  renewBefore: 720h   # 30 days
  issuerRef:
    name: keese-aigw-selfsigned
    kind: Issuer
  dnsNames:
    - envoy-ai-gateway.keese-system.svc
    - envoy-ai-gateway.keese-system.svc.cluster.local
    # Underlying generated Service name — clients may receive this as
    # the SNI target after CNAME resolution through the ExternalName alias.
    # The hash suffix is unstable; in production swap this for the
    # cluster-deterministic Service name template once the EG chart pins it.
    - "*.envoy-gateway-system.svc.cluster.local"
    - "*.envoy-gateway-system.svc"
---
# ── 4. Backend pointing at Anthropic's public API ───────────────────
# AIServiceBackend.backendRef must reference an envoy-gateway Backend
# CR (issue envoyproxy/ai-gateway#902). Standard K8s Services are not
# yet supported.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: anthropic
  namespace: keese-system
  labels:
    keese.ai/bootstrap: "true"
spec:
  endpoints:
    - fqdn:
        hostname: api.anthropic.com
        port: 443
---
# ── 5. BackendTLSPolicy for upstream TLS to api.anthropic.com ───────
# Uses the trust-manager-distributed `public-ca-bundle` ConfigMap
# rather than `wellKnownCACertificates: System`, because envoy-gateway
# v1.4 expects an SDS-supplied secret for system CAs that the gateway
# does not auto-provide (TLS handshake fails with
# "Secret is not supplied by SDS"). The bundle is generated by
# dev/bootstrap/cert-manager-issuers/public-ca-bundle.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: anthropic-tls
  namespace: keese-system
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: anthropic
  validation:
    hostname: api.anthropic.com
    caCertificateRefs:
      - kind: ConfigMap
        group: ""
        name: public-ca-bundle
---
# ── 6. AIServiceBackend wrapping the Backend (schema: OpenAI) ───────
# v0.4.0 dropped backendSecurityPolicyRef from AIServiceBackend; BSP
# now uses targetRefs to attach (HTTPRoute-style).
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIServiceBackend
metadata:
  name: anthropic
  namespace: keese-system
  labels:
    keese.ai/bootstrap: "true"
spec:
  # Native Anthropic schema (v0.4+). The OpenAI schema would route to
  # /v1/chat/completions but the BSP AnthropicAPIKey injection only
  # fires when the backend schema is Anthropic-shaped (extProc has a
  # dedicated /anthropic/v1/messages processor that handles x-api-key
  # injection).
  schema:
    name: Anthropic
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: anthropic
---
# ── 7. BackendSecurityPolicy injecting the API key header ───────────
# v0.4.0 added a native AnthropicAPIKey type that injects `x-api-key`
# directly (with no Bearer prefix) — Anthropic's expected auth shape.
# Replaces the OpenAI-style BSP + Lua header rewrite in v0.2.x.
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: BackendSecurityPolicy
metadata:
  name: anthropic-bsp
  namespace: keese-system
  labels:
    keese.ai/bootstrap: "true"
spec:
  type: AnthropicAPIKey
  anthropicAPIKey:
    secretRef:
      name: anthropic-api-key
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: anthropic
---
# ── 8. AIGatewayRoute attaching the route to the Gateway ────────────
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIGatewayRoute
metadata:
  name: anthropic
  namespace: keese-system
  labels:
    keese.ai/bootstrap: "true"
spec:
  # v0.4.0:
  # - schema moved to AIServiceBackend (no longer top-level on the route)
  # - targetRefs → parentRefs (Gateway API alignment)
  parentRefs:
    - kind: Gateway
      name: keese-aigateway
  rules:
    - backendRefs:
        - name: anthropic
      matches:
        - headers:
            - name: x-ai-eg-model
              value: claude-opus-4-7
              type: Exact
        - headers:
            - name: x-ai-eg-model
              value: claude-sonnet-4-6
              type: Exact
        - headers:
            - name: x-ai-eg-model
              value: claude-haiku-4-5
              type: Exact
# NOTE: A previous version of this stack had an EnvoyExtensionPolicy
# Lua filter named `anthropic-header-rewrite` that rewrote
# `Authorization: Bearer` → `x-api-key` to bridge the v0.2.x BSP
# (which only supported the OpenAI-style Authorization header) to
# Anthropic's expected x-api-key auth.
#
# v0.4.x BSP added a native `AnthropicAPIKey` type that injects
# `x-api-key` directly via extProc. Keeping the Lua filter alongside
# it overrides the AI Gateway's own EnvoyExtensionPolicy on the
# generated HTTPRoute (more-specific policy wins per Gateway API
# attachment rules), shadowing the extProc and preventing BSP
# injection — Anthropic then returns 401 "Invalid Anthropic API Key"
# (or "x-api-key header is required" for /v1/messages).
#
# The Lua filter has been intentionally removed.
