#
# ClusterSecretStore that lets ExternalSecrets read from OpenBao using the
# OpenBao token issued at install time. The token Secret is created by the
# scripts/dev/seed-openbao.sh wrapper (consumes BAO_TOKEN from the unseal
# step) — it is NOT committed.
#
# Reference: docs/designs/11-secrets-pluggable-vault.md
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: keese-openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: keese
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-token
          namespace: openbao
          key: token
