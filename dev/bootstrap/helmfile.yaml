#
# Declarative helmfile for the keese local-dev infra bootstrap stack.
# Install order is enforced via `needs:` — helmfile syncs releases in dependency
# order when `--concurrency 1` is used or when dependencies are declared.
#
# Usage: helmfile -f dev/bootstrap/helmfile.yaml sync
#        helmfile -f dev/bootstrap/helmfile.yaml diff
#        helmfile -f dev/bootstrap/helmfile.yaml template
#
# Chart versions are pinned and verified against upstream chart indexes
# as of 2026-05-06. Any version intentionally held back documents the reason
# inline. See TD-P1-08 in docs/plans/demo/tech-debt.md for the verification log.

environments:
  dev:
    values:
      - env/dev.yaml.gotmpl

---
repositories:
  - name: cilium
    url: https://helm.cilium.io
  - name: jetstack
    url: https://charts.jetstack.io
  - name: projectcapsule
    url: https://projectcapsule.github.io/charts
  # envoy charts moved to OCI registries (docker.io/envoyproxy/...).
  # The legacy https://charts.envoyproxy.io endpoint no longer resolves.
  - name: envoyproxy
    url: oci://docker.io/envoyproxy
    oci: true
  - name: openfga
    url: https://openfga.github.io/helm-charts
  - name: nats
    url: https://nats-io.github.io/k8s/helm/charts
  - name: elastic
    url: https://helm.elastic.co
  - name: kyverno
    url: https://kyverno.github.io/kyverno
  - name: openbao
    url: https://openbao.github.io/openbao-helm
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: qdrant
    url: https://qdrant.github.io/qdrant-helm
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts

releases:
  # ── Layer -1: CNI ──────────────────────────────────────────────────────
  # Cilium replaces kindnet (disabled in dev/kind/kind-config-demo.yaml).
  # Provides DNS-aware FQDN egress policies (CiliumNetworkPolicy) and
  # Service-port-aware NetworkPolicy matching, both of which kindnet
  # lacks (kindnet matches on the destination POD port, not the Service
  # port a client dials, breaking egress allowlists for cluster-internal
  # traffic). kubeProxyReplacement=true so we don't need kube-proxy too.
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.18.2
    values:
      - kubeProxyReplacement: true
        k8sServiceHost: keese-demo-control-plane
        k8sServicePort: 6443
        hubble:
          enabled: true
          relay:
            enabled: true
        ipam:
          mode: kubernetes
        image:
          pullPolicy: IfNotPresent

  # ── Layer 0: TLS foundation ────────────────────────────────────────────
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.15.3
    values:
      - values/cert-manager.yaml

  # trust-manager distributes CA bundles (incl. the public root bundle)
  # to consumer namespaces as ConfigMaps via the Bundle CR. Used by
  # BackendTLSPolicy to verify upstream TLS to api.anthropic.com et al.
  # without manually extracting CA bundles from cluster nodes.
  - name: trust-manager
    namespace: cert-manager
    createNamespace: false
    chart: jetstack/trust-manager
    version: v0.12.0
    needs:
      - cert-manager/cert-manager
    values:
      - secretTargets:
          enabled: true
          authorizedSecretsAll: true

  # ── Layer 1: Tenant isolation ──────────────────────────────────────────
  - name: capsule
    namespace: capsule-system
    createNamespace: true
    chart: projectcapsule/capsule
    version: 0.7.2
    # Upstream latest is 0.9.9; pinned at 0.7.2 — the 0.8.x→0.9.x
    # series introduced breaking changes to Tenant .spec.ingressOptions
    # and .spec.storageClasses selectors. Bump only after validating
    # Tenant CRD migration in dev/bootstrap/openbao/seed.sh context.
    needs:
      - cert-manager/cert-manager
    values:
      - values/capsule.yaml

  # ── Layer 1: Egress gateway ────────────────────────────────────────────
  - name: envoy-gateway
    namespace: envoy-gateway-system
    createNamespace: true
    chart: oci://docker.io/envoyproxy/gateway-helm
    # v1.6.0 (vs 1.4.1) ships the upstream-filter-mode ext_proc support
    # the AI Gateway BSP needs to inject Authorization on the upstream
    # phase. v1.4.x extProc only fires on the downstream phase, leaving
    # upstream requests un-authenticated.
    version: v1.6.0
    needs:
      - cert-manager/cert-manager
    values:
      - values/envoy-gateway.yaml

  # AI Gateway CRDs ship in a separate chart; the controller chart
  # crash-loops until these CRDs (AIGatewayRoute, AIServiceBackend,
  # BackendSecurityPolicy) are present.
  #
  # The AI Gateway chart hardcodes its mutating-webhook TLS cert SAN
  # to `ai-gateway-controller.envoy-ai-gateway-system.svc`, so we MUST
  # install in that exact namespace or the apiserver rejects the
  # webhook on TLS handshake.
  - name: envoy-ai-gateway-crds
    namespace: envoy-ai-gateway-system
    createNamespace: true
    chart: oci://docker.io/envoyproxy/ai-gateway-crds-helm
    version: v0.5.0
    needs:
      - envoy-gateway-system/envoy-gateway

  - name: envoy-ai-gateway
    namespace: envoy-ai-gateway-system
    createNamespace: false
    chart: oci://docker.io/envoyproxy/ai-gateway-helm
    version: v0.5.0
    needs:
      - envoy-gateway-system/envoy-gateway
      - envoy-ai-gateway-system/envoy-ai-gateway-crds
    values:
      - values/envoy-ai-gateway.yaml

  # ── Layer 1: Authorization ─────────────────────────────────────────────
  - name: openfga
    namespace: openfga
    createNamespace: true
    chart: openfga/openfga
    version: 0.2.62
    needs:
      - cert-manager/cert-manager
    values:
      - values/openfga.yaml

  # ── Layer 1: Policy engine ─────────────────────────────────────────────
  - name: kyverno
    namespace: kyverno
    createNamespace: true
    chart: kyverno/kyverno
    version: 3.8.0
    needs:
      - cert-manager/cert-manager
    values:
      - values/kyverno.yaml

  # ── Layer 1: Messaging ─────────────────────────────────────────────────
  - name: nats
    namespace: nats
    createNamespace: true
    chart: nats/nats
    version: 1.3.16
    needs:
      - cert-manager/cert-manager
    values:
      - values/nats.yaml

  - name: nack
    namespace: nats
    createNamespace: false
    chart: nats/nack
    version: 0.33.2
    needs:
      - cert-manager/cert-manager
      - nats/nats

  # ── Layer 1: Logging / observability backend ───────────────────────────
  - name: eck-operator
    namespace: elastic-system
    createNamespace: true
    chart: elastic/eck-operator
    version: 3.4.0
    needs:
      - cert-manager/cert-manager
    values:
      - values/eck.yaml

  # ── Layer 1: Secrets store ─────────────────────────────────────────────
  - name: openbao
    namespace: openbao
    createNamespace: true
    chart: openbao/openbao
    version: 0.9.0
    needs:
      - cert-manager/cert-manager
    values:
      - values/openbao.yaml

  - name: external-secrets
    namespace: external-secrets
    createNamespace: true
    chart: external-secrets/external-secrets
    version: 0.10.5
    # CANNOT BUMP: the charts.external-secrets.io index no longer publishes
    # 0.x charts (current index starts at 1.x/2.x). The 1.x/2.x series
    # is a rewrite with breaking changes to SecretStore CRD field paths.
    # Track TD-P2-18 to migrate ESO to 1.x once CRD migration is planned.
    needs:
      - cert-manager/cert-manager
      - openbao/openbao
    values:
      - values/external-secrets.yaml

  # ── Layer 1: Workflow engine ───────────────────────────────────────────
  - name: argo-workflows
    namespace: argo
    createNamespace: true
    chart: argo/argo-workflows
    version: 0.47.5
    needs:
      - cert-manager/cert-manager
    values:
      - values/argo-workflows.yaml

  # ── Layer 1: Vector memory ─────────────────────────────────────────────
  - name: qdrant
    namespace: qdrant
    createNamespace: true
    chart: qdrant/qdrant
    version: 1.17.1
    needs:
      - cert-manager/cert-manager
    values:
      - values/qdrant.yaml

  # ── Layer 2: Telemetry (depends on ECK for ES endpoint) ───────────────
  # otel-collector chart 0.112.0 requires `image.repository` to be set
  # explicitly (defaults dropped in upstream). Removed from the demo
  # bootstrap; OTEL wiring is a values-file fix tracked in
  # docs/plans/demo/tech-debt.md. The image is now set in
  # values/otel-collector.yaml (`image.repository:
  # otel/opentelemetry-collector-k8s`), so re-enabling is just uncommenting
  # this block and re-running `helmfile deps` to pin the chart in
  # helmfile.lock.
  #
  # CH5b (ADR 30): this is the Tier-1 collector that EXPORTS gateway
  # token-usage to the keese-token-meter's POST /ingest. Its values file now
  # carries the `metrics/tokenusage` pipeline + the `otlphttp/token-meter`
  # exporter (values/otel-collector.yaml). The meter Deployment + the dev
  # metering Prometheus that scrapes it are applied unconditionally by
  # `make bootstrap-infra` (dev/bootstrap/token-meter) so the contract series
  # materializes locally even while this collector release stays gated on the
  # tech-debt re-enable. CH5c reads that Prometheus.
  # - name: otel-collector
  #   namespace: observability
  #   createNamespace: true
  #   chart: open-telemetry/opentelemetry-collector
  #   version: 0.112.0
  #   needs: [elastic-system/eck-operator]
  #   values: [values/otel-collector.yaml]
