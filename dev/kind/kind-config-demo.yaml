# Minimal kind config for the local demo path (D4-kind variant).
# One control-plane + one worker, no taints. The full multi-tenant
# topology lives in kind-config.yaml; reuse that once tolerations
# are wired into chart values (TD-P2 backlog).
#
# Usage: kind create cluster --name=keese-demo --config=dev/kind/kind-config-demo.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: keese-demo

networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
  # kindnet is disabled so Cilium can install as the CNI. Cilium also
  # replaces kube-proxy (kubeProxyMode=none) so we get DNS-aware FQDN
  # egress policies + Service-port-aware NetworkPolicy matching out
  # of the box. See docs/references/cilium-on-kind.md.
  disableDefaultCNI: true
  kubeProxyMode: none

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
        listenAddress: "127.0.0.1"
  - role: worker
