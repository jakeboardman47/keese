#
# Sample keese Workflow CR — summarize-then-review pipeline.
# Two templated steps with NATS + cron triggers; the WorkflowRun
# reconciler projects each step into the configured back-end (Argo
# delegation deferred per docs/plans/demo/tech-debt.md).
#
# Refs: docs/designs/03-workflow-argo-delegation.md
#       docs/designs/09-transport-crd.md

apiVersion: keese.ai/v1alpha1
kind: Workflow
metadata:
  name: summarize-review
  namespace: tenant-a-default
  labels:
    keese.ai/tenant: tenant-a
    keese.ai/purpose: summarize-review
    keese.ai/env: dev
spec:
  workspaceRef:
    name: research
  entrypoint: summarize

  templates:
    - name: summarize
      image: ghcr.io/keese-ai/goose-runtime:dev
      command: ["/usr/local/bin/goose"]
      args: ["run", "--recipe", "/var/run/keese/recipes/recipe.yaml"]
      transportRef:
        name: tenant-a-bus
      retryLimit: 1

    - name: review
      image: ghcr.io/keese-ai/goose-runtime:dev
      command: ["/usr/local/bin/goose"]
      args: ["run", "--recipe", "/var/run/keese/recipes/recipe.yaml"]
      transportRef:
        name: tenant-a-bus
      retryLimit: 1

  triggers:
    - type: NATSSubscription
      natsSubscription:
        streamName: AGENT_MSG
        subject: "workspace.tenant-a.msg.summarize"
        durable: workflow-runner
    - type: Cron
      cron:
        schedule: "0 9 * * 1-5"
        timezone: UTC

  outputs:
    - name: review-result
      type: NATSPublish
      natsPublish:
        subject: "workspace.tenant-a.results.review"

  concurrencyPolicy: Allow
