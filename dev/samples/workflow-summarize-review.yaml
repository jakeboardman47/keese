# Sample keese Workflow CR — summarize-then-review pipeline.
# Two-step workflow: step 1 summarizes input documents (NATS trigger),
# step 2 reviews the summary (Argo delegation).
# Fields marked FIXME(design-gate) depend on schema finalization.
#
# Refs: docs/designs/03-workflow-argo-delegation.md
#       docs/designs/09-transport-crd.md
#       docs/designs/22-workflow-composition-examples.md

apiVersion: workflow.operator.keese.ai/v1alpha1
kind: Workflow
metadata:
  name: summarize-review
  namespace: tenant-a-default
  labels:
    keese.ai/tenant: tenant-a
    keese.ai/purpose: summarize-review
    keese.ai/env: dev
spec:
  # Workspace scope — agent identity + memory + guardrails from workspace.
  # FIXME(design-gate): workspaceRef field from design 03 / workflow spec
  workspaceRef:
    name: research
    kind: Workspace
    apiGroup: workspace.operator.keese.ai

  # Trigger: NATS subject + optional cron fallback.
  # FIXME(design-gate): triggers[] schema from design 22 / workflow spec
  triggers:
    - type: nats
      nats:
        subject: "workspace.tenant-a.msg.summarize"
        consumerRef:
          name: workflow-runner
          stream: AGENT_MSG
    - type: cron
      cron:
        schedule: "0 9 * * 1-5"  # 09:00 weekdays

  # Two-step pipeline projected to an Argo WorkflowTemplate.
  # FIXME(design-gate): steps[] schema from design 03 / workflow spec
  steps:
    - name: summarize
      # FIXME(design-gate): recipeRef schema from design 16 / recipe spec
      recipeRef:
        name: document-summarizer
        kind: Recipe
        apiGroup: recipe.operator.keese.ai
      transport:
        type: nats
        nats:
          subject: "agent.tenant-a.summarize"

    - name: review
      recipeRef:
        name: summary-reviewer
        kind: Recipe
        apiGroup: recipe.operator.keese.ai
      transport:
        type: nats
        nats:
          subject: "agent.tenant-a.review"
      # Step 2 depends on step 1 completing.
      # FIXME(design-gate): dependsOn field from design 03
      dependsOn: [summarize]

  # Guardrail binding (inherits from workspace; may tighten here).
  # FIXME(design-gate): guardrailBindingRef in workflow context from design 06
  guardrailBindingRef:
    name: tenant-alpha-strict
    kind: GuardrailBinding
    apiGroup: guardrail.operator.keese.ai

  # Outputs — post review result to a NATS subject.
  # FIXME(design-gate): outputs[] schema from design 22 / workflow spec
  outputs:
    - type: nats
      nats:
        subject: "workspace.tenant-a.results.review"
