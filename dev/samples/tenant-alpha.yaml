# Sample Capsule Tenant for tenant-a.
# Applied by scripts/dev/smoke.sh as part of the post-gate smoke test.
# Capsule reconciles this into namespace(s), NetworkPolicy, ResourceQuota,
# LimitRange, and RBAC per the tenant spec.
#
# Refs: docs/designs/01-tenancy-capsule.md

apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: tenant-alpha
  labels:
    keese.ai/tenant: tenant-a
    keese.ai/tier: standard
    # FIXME(design-gate): align label schema with design 01-tenancy-capsule.md
spec:
  owners:
    - name: tenant-alpha-admin
      kind: User
      # FIXME(design-gate): reference actual OIDC user once identity is wired

  namespaceOptions:
    quota: 10
    additionalMetadata:
      labels:
        keese.ai/tenant: tenant-a
        keese.ai/env: dev

  resourceQuotas:
    scope: Tenant
    items:
      - hard:
          requests.cpu: "8"
          requests.memory: "8Gi"
          limits.cpu: "16"
          limits.memory: "16Gi"
          pods: "50"
          # FIXME(design-gate): tune quotas once workspace sizing is designed (02)

  limitRanges:
    items:
      - limits:
          - type: Container
            default:
              cpu: 500m
              memory: 256Mi
            defaultRequest:
              cpu: 100m
              memory: 128Mi

  nodeSelector:
    keese.ai/tenant: tenant-a

  ingressOptions:
    allowedClasses:
      matchNames:
        - keese-gateway
        # FIXME(design-gate): finalize GatewayClass name in design 05a
