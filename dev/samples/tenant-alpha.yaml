# Sample Capsule Tenant for tenant-a (the upstream tenant primitive).
# The keese.ai/v1alpha1 Tenant CR sits on top of this; see config/samples/
# tenancy/tenant-minimal.yaml for the keese-side counterpart.
#
# Refs: docs/designs/01-tenancy-capsule.md

apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: tenant-alpha
  labels:
    keese.ai/tenant: tenant-a
    keese.ai/tier: standard
spec:
  owners:
    - name: alice@example.com
      kind: User

  namespaceOptions:
    quota: 10
    additionalMetadata:
      labels:
        keese.ai/tenant: tenant-a
        keese.ai/env: dev

  resourceQuotas:
    scope: Tenant
    items:
      - hard:
          requests.cpu: "8"
          requests.memory: "8Gi"
          limits.cpu: "16"
          limits.memory: "16Gi"
          pods: "50"

  limitRanges:
    items:
      - limits:
          - type: Container
            default:
              cpu: 500m
              memory: 256Mi
            defaultRequest:
              cpu: 100m
              memory: 128Mi

  ingressOptions:
    allowedClasses:
      matchNames:
        - keese-aigateway
