#
# Sample keese Workspace CR — the "research" workspace under tenant-a.
# Schema mirrors api/keese/v1alpha1/workspace_types.go and is kept in
# lock-step with config/samples/workspace_v1alpha1_workspace.yaml.
#
# Refs: docs/designs/02-workspace-model.md
#       docs/designs/07-agent-runtime-spi.md
#       docs/designs/15-memory-management.md

apiVersion: keese.ai/v1alpha1
kind: Workspace
metadata:
  name: research
  namespace: tenant-a-default
  labels:
    keese.ai/tenant: tenant-a
    keese.ai/purpose: research
    keese.ai/env: dev
spec:
  tenantRef:
    name: tenant-alpha

  runtimeRef:
    name: goose-default

  memoryRefs:
    - name: ws-sessions-sqlite

  guardrailBindingRefs:
    - name: tenant-alpha-strict

  interactive: true
  sessionMode: OnDemand
  attachPolicy: Reuse

  egress:
    allowedTools:
      - anthropic.messages
      - anthropic.messages.opus-4
      - anthropic.messages.sonnet-4
      - anthropic.messages.haiku-4
