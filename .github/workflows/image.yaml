# Copyright (c) 2026 keese-ai
# Decision refs: D17 cosign keyless, D19 SBOM syft attestation, D20 multi-arch
#
# Tag-triggered publish for every keese-published image:
#   - ghcr.io/keese-ai/keese                 (operator)
#   - ghcr.io/keese-ai/keese-cosign-webhook  (TD-P1-04 admission gate)
#
# Each image is buildx multi-arch, cosign keyless OIDC signed, and
# carries an SBOM cosign attestation. On main pushes (non-tag) we
# only build to surface compile errors — no push, no signing.
#
# The Dockerfile presence check that used to gate this workflow has
# been removed (TD-P1-05): a missing Dockerfile is now a CI failure
# rather than a silent skip, because the local-build fallback that
# justified the skip has been cut.

name: Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-push-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: keese
            dockerfile: Dockerfile
            repo: ghcr.io/keese-ai/keese
          - name: keese-cosign-webhook
            dockerfile: Dockerfile.keese-cosign-webhook
            repo: ghcr.io/keese-ai/keese-cosign-webhook
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: assert dockerfile present
        run: |
          test -f ${{ matrix.dockerfile }} || {
            echo "::error file=${{ matrix.dockerfile }}::missing — CI cannot publish without a Dockerfile"
            exit 1
          }
      - name: set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ matrix.repo }}:${{ github.ref_name }}
      - name: install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: cosign sign (keyless OIDC)
        run: |
          cosign sign --yes \
            ${{ matrix.repo }}@${{ steps.push.outputs.digest }}
      - name: install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: generate SBOM + attest
        run: |
          syft ${{ matrix.repo }}@${{ steps.push.outputs.digest }} \
            -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json \
            ${{ matrix.repo }}@${{ steps.push.outputs.digest }}
      - name: cosign verify (self-check)
        run: |
          bash scripts/bundle-sign-verify.sh \
            ${{ matrix.repo }}@${{ steps.push.outputs.digest }}
