#
# Verify the commit that opens the design gate is signed by a member
# of @keese-ai/architects. Triggered when the gate-status banner in
# docs/plans/README.md flips from closed -> open on main.
#
# Plan ref: docs/plans/README.md#gate-status, P8.

name: verify-gate-commit

on:
  push:
    branches: [main]
    paths:
      - 'docs/plans/README.md'

permissions:
  contents: read

concurrency:
  group: verify-gate-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: detect gate flip
        id: flip
        run: |
          set -euo pipefail
          prev="$(git show HEAD~1:docs/plans/README.md 2>/dev/null || true)"
          cur="$(cat docs/plans/README.md)"
          prev_status="$(echo "$prev" | awk '/^---$/{c++;next} c==1 && /^gate_status:/ {print $2;exit}')"
          cur_status="$(echo "$cur"  | awk '/^---$/{c++;next} c==1 && /^gate_status:/ {print $2;exit}')"
          echo "prev=${prev_status}" >> "$GITHUB_OUTPUT"
          echo "cur=${cur_status}"  >> "$GITHUB_OUTPUT"

      - name: verify architect signed (if gate flipped to open)
        if: steps.flip.outputs.prev == 'closed' && steps.flip.outputs.cur == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          author="${{ github.event.head_commit.author.username || github.event.head_commit.author.name }}"
          echo "Gate flipped closed -> open by: ${author}"
          # Require team membership via gh API. Fails if the author is
          # not a member of keese-ai/architects.
          if ! gh api "orgs/keese-ai/teams/architects/memberships/${author}" --jq '.state' 2>/dev/null | grep -q '^active$'; then
            echo "::error::Gate-open commit must be signed by a member of @keese-ai/architects"
            exit 1
          fi
          # Require GPG or SSH signature verification
          verified="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq '.commit.verification.verified')"
          if [ "${verified}" != "true" ]; then
            echo "::error::Gate-open commit must be cryptographically signed (verified=${verified})"
            exit 1
          fi

      - name: no flip — no-op
        if: steps.flip.outputs.prev == steps.flip.outputs.cur
        run: echo "gate_status unchanged (${{ steps.flip.outputs.cur }}); nothing to verify"
