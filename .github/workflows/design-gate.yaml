# Decision refs: D07 design gate — API/controller changes require a design doc

name: Design Gate

on:
  pull_request:
    paths:
      - 'api/**'
      - 'internal/controller/**'
      - 'docs/designs/**'
      - 'docs/specs/**'
      - 'docs/plans/**'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: design-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: run design gate check
        id: gate
        run: bash scripts/check-design-gate.sh
        continue-on-error: true
      - name: post sticky PR comment on failure
        if: steps.gate.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = '<!-- keese-design-gate -->';
            const body = `${marker}\n## Design Gate Failed\n\nThis PR modifies \`api/\`, \`internal/controller/\`, or design docs but did not pass the design-gate check.\n\nPlease run \`bash scripts/check-design-gate.sh\` locally and address the issues before merging.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: fail if gate did not pass
        if: steps.gate.outcome == 'failure'
        run: exit 1
