#
# kuttl step 03: assert the REAL drain contract survived pod replacement.
#
# A fresh "resumer" pod mounts the SAME session PVC the drained pod used and
# asserts, on durable storage (rule 06-signal-handling §5):
#   1. the real keese-drain checkpoint marker sessions/<uid>/draining exists
#      and has the binary's real shape (version "v1", workspace_uid, sqlite_ref)
#      — proving the actual binary, not a stand-in, ran;
#   2. the draining-active readiness sentinel exists (rule 06 §9);
#   3. the goose session SQLite (seeded in step 01) SURVIVED the
#      delete → new-pod cycle, i.e. memory was not lost.
#
# When the goose-runtime image is not loaded, step 02 skipped the real drain
# (sentinel /tmp/keese-drain-skip). In that case the checkpoint won't exist, so
# this step asserts ONLY SQLite survival (always seeded, infra-independent) and
# reports the checkpoint assertion as skipped. The real-binary assertions run
# automatically once `make goose-runtime-load` makes the image live.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # namespaced:false — assert against the explicit `drain-test` namespace where
  # the session PVC and the drained checkpoint live (see 02-drain.yaml).
  - namespaced: false
    skipLogOutput: false
    script: |
      set -euo pipefail
      NS=drain-test

      DRAIN_SKIPPED=0
      if [ -f /tmp/keese-drain-skip ]; then
        DRAIN_SKIPPED=1
        echo "[03-resume] keese-drain image absent: asserting SQLite survival only;"
        echo "[03-resume] checkpoint-marker assertions are SKIPPED (run make goose-runtime-load)."
      fi

      # The resumer runs busybox (always available) so the assertion does not
      # itself depend on the goose-runtime image — it only READS the PVC the
      # real binary wrote.
      kubectl apply -n "${NS}" -f - <<POD
      apiVersion: v1
      kind: Pod
      metadata:
        name: drain-test-resumer
        labels:
          keese.ai/test: agentruntime-drain
          app.kubernetes.io/component: resume-verifier
      spec:
        restartPolicy: Never
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        volumes:
          - name: session
            persistentVolumeClaim:
              claimName: drain-test-session
          - name: scratch
            emptyDir:
              sizeLimit: 256Mi
        containers:
          - name: resumer
            image: busybox:1.36
            imagePullPolicy: IfNotPresent
            env:
              - name: KEESE_SESSION_ID
                value: "drain-test-uid"
              - name: DRAIN_SKIPPED
                value: "${DRAIN_SKIPPED}"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -e
                PVC_ROOT=/var/run/keese/session
                WS_UID="\${KEESE_SESSION_ID:-unknown}"
                SESSION_DIR="\${PVC_ROOT}/sessions/\${WS_UID}"

                # (3) SQLite memory survival — ALWAYS asserted (seeded step 01).
                GOOSE_DB="\${PVC_ROOT}/home/.local/share/goose/sessions/sessions.db"
                if [ ! -s "\${GOOSE_DB}" ]; then
                  echo "FAIL: goose sessions.db missing/empty — memory did not survive" >&2
                  exit 1
                fi
                echo "OK: goose sessions.db survived pod replacement"

                if [ "\${DRAIN_SKIPPED}" = "1" ]; then
                  echo "SKIP: keese-drain image absent — checkpoint assertions skipped"
                  exit 0
                fi

                # (1) Real keese-drain checkpoint marker.
                MARKER="\${SESSION_DIR}/draining"
                if [ ! -f "\${MARKER}" ]; then
                  echo "FAIL: checkpoint marker \${MARKER} missing — real keese-drain did not run" >&2
                  exit 1
                fi
                echo "OK: checkpoint marker present:"
                cat "\${MARKER}"
                # Assert the marker has keese-drain's real JSON shape.
                grep -q '"version":"v1"' "\${MARKER}"  || { echo "FAIL: marker missing version v1" >&2; exit 1; }
                grep -q "\"workspace_uid\":\"\${WS_UID}\"" "\${MARKER}" || { echo "FAIL: marker workspace_uid mismatch" >&2; exit 1; }
                grep -q '"sqlite_ref"' "\${MARKER}" || { echo "FAIL: marker missing sqlite_ref" >&2; exit 1; }

                # (2) draining-active readiness sentinel (rule 06 §9).
                if [ ! -f "\${PVC_ROOT}/draining-active" ]; then
                  echo "FAIL: draining-active sentinel missing" >&2
                  exit 1
                fi
                echo "OK: draining-active sentinel present"

                # The session.sqlite referenced by sqlite_ref survived too.
                if [ ! -s "\${SESSION_DIR}/session.sqlite" ]; then
                  echo "FAIL: \${SESSION_DIR}/session.sqlite missing" >&2
                  exit 1
                fi
                echo "OK: real keese-drain checkpoint + SQLite survived drain/restart"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            volumeMounts:
              - name: session
                mountPath: /var/run/keese/session
              - name: scratch
                mountPath: /tmp
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
      POD

      kubectl wait -n "${NS}" --for=jsonpath='{.status.phase}'=Succeeded \
        pod/drain-test-resumer --timeout=120s
      echo "[03-resume] resumer logs:"
      kubectl logs -n "${NS}" pod/drain-test-resumer
