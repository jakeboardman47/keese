#
# kuttl step 03 (apply): start a "new pod" that simulates Bootstrap + Resume.
# It reads the checkpoint marker left by step 02 and asserts the SQLite file
# (stand-in: our plain JSON file from step 01) still exists.
#
# This validates the Drain → Resume round-trip: memory written in step 01
# survives the pod replacement and is accessible to the new pod.
apiVersion: v1
kind: Pod
metadata:
  name: drain-test-resumer
  namespace: drain-test
  labels:
    keese.ai/test: agentruntime-drain
    app.kubernetes.io/component: resume-verifier
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: session
      persistentVolumeClaim:
        claimName: drain-test-session
    - name: scratch
      emptyDir:
        sizeLimit: 256Mi
  containers:
    - name: resumer
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      env:
        - name: KEESE_SESSION_ID
          value: "drain-test-uid"
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          PVC_ROOT=/var/run/keese/session
          WS_UID="${KEESE_SESSION_ID:-unknown}"
          SESSION_DIR="${PVC_ROOT}/sessions/${WS_UID}"

          # Assert the checkpoint marker exists (written by step 02 drain).
          if [ ! -f "${SESSION_DIR}/draining" ]; then
            echo "FAIL: checkpoint marker not found at ${SESSION_DIR}/draining"
            exit 1
          fi
          echo "OK: checkpoint marker found"
          cat "${SESSION_DIR}/draining"

          # Assert the SQLite stand-in file (memory) survived (written in step 01).
          if [ ! -f "${SESSION_DIR}/session.sqlite" ]; then
            echo "FAIL: session.sqlite (memory) not found — memory did not survive pod restart"
            exit 1
          fi
          echo "OK: session.sqlite (memory) survived pod restart"
          cat "${SESSION_DIR}/session.sqlite"

          # Simulate Resume: remove the draining-active sentinel.
          rm -f "${PVC_ROOT}/draining-active"
          echo "Resume complete — memory survived drain/restart cycle"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: session
          mountPath: /var/run/keese/session
        - name: scratch
          mountPath: /tmp
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
