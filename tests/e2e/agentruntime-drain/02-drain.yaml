#
# kuttl step 02 (apply): run the keese-drain binary against the PVC to write
# the checkpoint marker. This simulates what the preStop lifecycle hook does
# when kubelet terminates the agent pod.
#
# In production, KEESE_SESSION_ID is injected by the downward API as the pod
# name. Here we set it to the workspace UID used by the writer pod.
apiVersion: v1
kind: Pod
metadata:
  name: drain-test-drainer
  namespace: drain-test
  labels:
    keese.ai/test: agentruntime-drain
    app.kubernetes.io/component: drain-runner
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: session
      persistentVolumeClaim:
        claimName: drain-test-session
    - name: scratch
      emptyDir:
        sizeLimit: 256Mi
  containers:
    - name: drainer
      # Use busybox to simulate keese-drain without the full operator image.
      # When the full image is available this should reference the operator image
      # containing /usr/local/bin/keese-drain.
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      env:
        - name: KEESE_SESSION_ID
          value: "drain-test-uid"
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          PVC_ROOT=/var/run/keese/session
          WS_UID="${KEESE_SESSION_ID:-unknown}"
          SESSION_DIR="${PVC_ROOT}/sessions/${WS_UID}"
          mkdir -p "${SESSION_DIR}"

          # Write draining-active sentinel (rule 06.9: readiness NotReady on SIGTERM).
          echo "draining" > "${PVC_ROOT}/draining-active.tmp"
          mv "${PVC_ROOT}/draining-active.tmp" "${PVC_ROOT}/draining-active"

          # Write JSON checkpoint marker atomically.
          SQLITE_REF="${SESSION_DIR}/session.sqlite"
          WRITTEN_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          MARKER="{\"version\":\"v1\",\"workspace_uid\":\"${WS_UID}\",\"written_at\":\"${WRITTEN_AT}\",\"sqlite_ref\":\"${SQLITE_REF}\"}"
          echo "${MARKER}" > "${SESSION_DIR}/draining.tmp"
          mv "${SESSION_DIR}/draining.tmp" "${SESSION_DIR}/draining"

          echo "Checkpoint written: ${SESSION_DIR}/draining"
          cat "${SESSION_DIR}/draining"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: session
          mountPath: /var/run/keese/session
        - name: scratch
          mountPath: /tmp
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
