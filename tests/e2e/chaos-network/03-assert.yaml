#
# kuttl step 03 (assert): after the deny-all egress NetworkPolicy is applied,
# the WorkspaceSession controller must detect the gateway unreachability and
# set the EgressUnavailable condition to True within 30s.
#
# Additionally, a one-shot egress probe pod is launched and asserted to exit
# non-zero (Failed), proving the NetworkPolicy blocks egress from within the
# namespace — no infinite hang, no OOM, exit within the 10s nc timeout.
#
# Owner: TD-P3-08.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 60
commands:
  # Assert the EgressUnavailable condition flips True on the session.
  - command: kubectl wait --for=condition=EgressUnavailable workspacesession/chaos-session -n chaos-test --timeout=30s
  # Launch and wait for a quick egress probe to confirm the NetworkPolicy
  # actually blocks (belt-and-suspenders on top of the condition check).
  - command: |
      kubectl run chaos-egress-probe \
        --image=busybox:1.36 \
        --restart=Never \
        --namespace=chaos-test \
        --labels=keese.ai/test=chaos-network \
        --command -- sh -c \
        'nc -z -w 10 envoy-gateway.envoy-gateway-system.svc.cluster.local 443 2>/dev/null && exit 0 || exit 1' \
        --wait --timeout=20s || true
  - command: kubectl wait --for=jsonpath='{.status.phase}'=Failed pod/chaos-egress-probe -n chaos-test --timeout=20s
