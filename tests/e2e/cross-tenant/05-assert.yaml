#
# EH6 kuttl step 05 (assert): the CrossTenantAgreement is gone — the NATS
# finalizer ran to completion and Kubernetes removed the object.
#
# kuttl's `errors:` block fails the step if the named object EXISTS; we want
# it absent. A finalizer stuck open would leave the object in Terminating,
# tripping this assert.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 120
errors:
  - apiVersion: authz.keese.ai/v1alpha1
    kind: CrossTenantAgreement
    metadata:
      name: beta2-to-alpha2
