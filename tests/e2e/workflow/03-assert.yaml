#
# EH9 kuttl step 03 (assert): the WorkflowRun reaches a TERMINAL phase.
#
# Deliverable #2, part 2 (runs + terminal Succeeded). The live Argo
# workflow-controller executes the argosay container to completion; the
# WorkflowRunReconciler's syncArgoStatus (workflowrun_controller.go §379)
# polls the Argo Workflow each 15s requeue and maps Argo phase Succeeded ->
# keese phase Succeeded + Ready=True (§403). A terminal Succeeded is the
# end-to-end proof that Workflow -> Argo WorkflowTemplate -> WorkflowRun ->
# Argo Workflow -> back-projected status all wired correctly.
#
# Timeout is generous: it covers the argosay image pull on a cold node plus
# up to two 15s reconcile-requeue cycles for the back-projection to land.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
commands:
  - command: |
      kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
        workflowrun/wfr-demo -n wf-e2e --timeout=270s
  - command: |
      kubectl wait --for=condition=Ready \
        workflowrun/wfr-demo -n wf-e2e --timeout=30s
---
apiVersion: keese.ai/v1alpha1
kind: WorkflowRun
metadata:
  name: wfr-demo
  namespace: wf-e2e
status:
  phase: Succeeded
  # syncArgoStatus mirrors the Argo phase verbatim (§392).
  argoPhase: Succeeded
  argoWorkflowName: keese-wfr-wfr-demo
---
