#
# Webhook Service — TLS endpoint for the Recipe validating + defaulting webhook.
# cert-manager injects the CA bundle via annotation on the WebhookConfiguration;
# see certificate.yaml for the Certificate CR and issuer reference.
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: keese
    app.kubernetes.io/managed-by: kustomize
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: keese
