#
# Seed FeatureGate CRs + the kyverno tamper-resistance ClusterPolicy.
# Folded into the operator's overlay so the projection ConfigMap +
# the gates exist before the cosign-webhook (and future consumers)
# come up.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cosign-installplan-verify.yaml
  - cosign-installplan-failclosed.yaml
  - policy.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: keese
