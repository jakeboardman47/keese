#
# Pairs with cosign-installplan-verify. Off → verify failures are
# downgraded to Allowed + Warning + Event(BundleUnsignedAdmittedDryRun)
# so operators can stage a rollout (log-only first, then enforcing).
apiVersion: policy.keese.ai/v1alpha1
kind: FeatureGate
metadata:
  name: cosign-installplan-failclosed
  labels:
    app.kubernetes.io/part-of: keese
    keese.ai/owner: keese-cosign-webhook
spec:
  description: |
    Whether cosign verification failures result in a deny (true) or a
    warning + Allowed (false). Only consulted when
    cosign-installplan-verify is on.
  stage: alpha
  owners:
    - keese-cosign-webhook
  restartRequired: false
