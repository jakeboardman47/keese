# Bootstrap OIDCProvider: google
# Trusts Google Workspace / Google Identity OIDC tokens.
# Admins may add jwksUri override for air-gapped clusters.
# Spec: docs/specs/authz.operator.keese.ai-v1alpha1.md §1.5
apiVersion: authz.operator.keese.ai/v1alpha1
kind: OIDCProvider
metadata:
  name: google
  labels:
    keese.ai/bootstrap: "true"
spec:
  issuer: https://accounts.google.com
  audiences:
    - keese-egress-*
  subjectTemplate: "{{ lower .Claims.email }}"
  audienceTemplates:
    - name: egress
      template: "keese-egress-{{ .Claims.tenant }}"
      expirationSeconds: 600
  normalization:
    lowercase: true
    trim: true
