apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
  name: keese.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: |-
        AgentRuntime is the Schema for the agentruntimes API.
        Cluster-scoped; registers a runtime provider implementation.
      displayName: Agent Runtime
      kind: AgentRuntime
      name: agentruntimes.keese.ai
      version: v1alpha1
    - description: |-
        CrossTenantAgreement is the Schema for the crosstenanagreements API.
        CrossTenantAgreement is cluster-scoped; it governs cross-tenant NATS messaging and A2A roles.
        Design: docs/designs/25-cross-tenant-agreement.md + 25-ii-spec-schema.md + 25-iii-approval-flow.md
        Spec: docs/specs/keese.ai-v1alpha1-ii-cra.md
      displayName: Cross Tenant Agreement
      kind: CrossTenantAgreement
      name: crosstenantagreements.authz.keese.ai
      version: v1alpha1
    - description: |-
        GuardrailBinding is the Schema for the guardrailbindings API.
        It composes Kyverno policies, OpenFGA tuples, Envoy SecurityPolicy refs,
        recipe hooks, and token budgets into a single CRD with a strictest-wins
        merge lattice spanning Cluster / Tenant / Workspace scopes.
      displayName: Guardrail Binding
      kind: GuardrailBinding
      name: guardrailbindings.authz.keese.ai
      version: v1alpha1
    - description: Memory is the Schema for the memories API.
      displayName: Memory
      kind: Memory
      name: memories.keese.ai
      version: v1alpha1
    - description: |-
        OIDCProvider is the Schema for the oidcproviders API.
        OIDCProvider is cluster-scoped and configures OIDC issuer trust for the Envoy AI Gateway
        ext_authz pipeline. Bootstrap CRs (kubernetes-default, google, github-actions, etc.) are
        created by the keese-oidcprovider-bootstrap Job at install time.

        Design: docs/designs/04b-projected-sa-identity.md + docs/designs/04b-ii-oidc-trust.md
        Spec: docs/specs/authz.keese.ai-v1alpha1.md

        tenant.uses_oidc_provider OpenFGA relation: the Tenant controller writes tuples
        (tenant:<name>#uses_oidc_provider@oidc_provider:<spec.oidc.allowedProviders[]>) per
        04a iter-6; this controller owns OIDCProvider CRs only — tuples are written by Tenant.
      displayName: OIDCProvider
      kind: OIDCProvider
      name: oidcproviders.authz.keese.ai
      version: v1alpha1
    - description: Recipe is the Schema for the recipes API.
      displayName: Recipe
      kind: Recipe
      name: recipes.keese.ai
      version: v1alpha1
    - description: RecipeSource is the Schema for the recipesources API.
      displayName: Recipe Source
      kind: RecipeSource
      name: recipesources.keese.ai
      version: v1alpha1
    - description: |-
        RuntimeExtension is the Schema for the runtimeextensions API.
        Namespaced; bundles N tools for a runtime and manages ReBAC tuples.
      displayName: Runtime Extension
      kind: RuntimeExtension
      name: runtimeextensions.keese.ai
      version: v1alpha1
    - description: SharedMemory is the Schema for the sharedmemories API.
      displayName: Shared Memory
      kind: SharedMemory
      name: sharedmemories.keese.ai
      version: v1alpha1
    - description: |-
        Tenant is the Schema for the tenants API.
        Tenant is cluster-scoped; its name IS the OpenFGA identity key.
        Design: docs/designs/24-tenant-crd.md + docs/designs/24b-tenant-crd.md
        Spec: docs/specs/keese.ai-v1alpha1-ii-tenant.md
      displayName: Tenant
      kind: Tenant
      name: tenants.keese.ai
      version: v1alpha1
    - description: TokenBudget is the Schema for the tokenbudgets API.
      displayName: Token Budget
      kind: TokenBudget
      name: tokenbudgets.policy.keese.ai
      version: v1alpha1
    - description: Transport is the Schema for the transports API.
      displayName: Transport
      kind: Transport
      name: transports.keese.ai
      version: v1alpha1
    - description: |-
        WorkflowRun is the Schema for the workflowruns API.
        It projects an Argo Workflow and manages NATS streams, SA tokens, and CTA checks.
      displayName: Workflow Run
      kind: WorkflowRun
      name: workflowruns.keese.ai
      version: v1alpha1
    - description: |-
        Workflow is the Schema for the workflows API.
        It projects an Argo WorkflowTemplate and manages triggers and outputs.
      displayName: Workflow
      kind: Workflow
      name: workflows.keese.ai
      version: v1alpha1
    - description: Workspace is the Schema for the workspaces API.
      displayName: Workspace
      kind: Workspace
      name: workspaces.keese.ai
      version: v1alpha1
    - description: |-
        WorkspaceSession is the Schema for the workspacesessions API.
        WorkspaceSession is namespace-scoped (same namespace as parent Workspace).
        Name pattern: <workspace>-<subject-hash-16>-<session-name>.
        Design: docs/designs/08b-goose-acp-stdio-k8s.md + docs/designs/08b-ii-session-crd-spec.md
        Spec: docs/specs/keese.ai-v1alpha1-ii-session.md
      displayName: Workspace Session
      kind: WorkspaceSession
      name: workspacesessions.keese.ai
      version: v1alpha1
    - description: WorkspaceShare is the Schema for the workspaceshares API.
      displayName: Workspace Share
      kind: WorkspaceShare
      name: workspaceshares.keese.ai
      version: v1alpha1
  description: |
    keese is a secure multi-tenant, multi-workspace Kubernetes operator
    orchestrating autonomous AI agent workflows on pluggable agent runtimes
    (goose first). Namespaces are the tenant boundary. Identity is a
    projected Kubernetes ServiceAccount token; authorization is ReBAC
    (OpenFGA); egress flows through Envoy AI Gateway, which terminates
    the agent's SA token and injects the correct upstream credential per
    target. See https://github.com/keese-ai/keese for design docs.

    DESIGN GATE: pre-alpha. Controller logic is stub-only until all 30
    designs + 11 specs score >= 90/100 on docs/plans/rubric.md.
  displayName: keese
  install:
    spec:
      deployments: null
    strategy: ""
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - keese
  - agents
  - ai
  - multi-tenant
  - goose
  - agentic
  - reBAC
  - openfga
  links:
  - name: Project URL
    url: https://keese.ai
  - name: Source
    url: https://github.com/keese-ai/keese
  maintainers:
  - email: security@keese.ai
    name: keese-ai maintainers
  maturity: alpha
  minKubeVersion: 1.30.0
  provider:
    name: keese-ai
    url: https://keese.ai
  version: 0.0.0
