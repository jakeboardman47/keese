# Minimal Workspace sample — satisfies rule 04.15.
# Must pass: kubectl apply --dry-run=server
apiVersion: keese.ai/v1alpha1
kind: Workspace
metadata:
  labels:
    app.kubernetes.io/name: keese
    app.kubernetes.io/managed-by: kustomize
    keese.ai/managed: "true"
  name: workspace-sample-minimal
spec:
  runtimeRef:
    name: default-runtime
  tenantRef:
    name: acme-tenant
  sessionMode: OnDemand
  concurrencyPolicy: Allow
