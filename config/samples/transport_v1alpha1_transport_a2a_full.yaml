apiVersion: transport.operator.keese.ai/v1alpha1
kind: Transport
metadata:
  labels:
    app.kubernetes.io/name: keese
    app.kubernetes.io/managed-by: kustomize
    keese.ai/managed: "true"
  name: transport-a2a-full
  namespace: default
spec:
  type: a2a
