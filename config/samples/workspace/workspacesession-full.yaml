# Fully-populated WorkspaceSession sample — shared mode, custom grace, preserve on failure.
# Spec: docs/specs/workspace.operator.keese.ai-v1alpha1-ii-session.md
apiVersion: workspace.operator.keese.ai/v1alpha1
kind: WorkspaceSession
metadata:
  name: ws-collab-deadbeef01234567-primary
  namespace: tenant-acme
  labels:
    keese.ai/workspace: ws-collab
    keese.ai/subject-hash: deadbeef01234567
    keese.ai/session-name: primary
  finalizers:
    - finalizers.workspacesession.operator.keese.ai/cleanup
spec:
  workspaceRef: ws-collab
  attachSubject: "user:bob@acme.example.com"
  sessionName: primary
  mode: shared
  attachGraceSeconds: 300
  preserveOnPodFailure: true
