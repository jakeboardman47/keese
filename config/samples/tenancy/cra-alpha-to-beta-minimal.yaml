# Minimal CrossTenantAgreement sample — requires alpha and beta Tenant CRs to exist.
# Spec: docs/specs/authz.keese.ai-v1alpha1-ii-cra.md
apiVersion: authz.keese.ai/v1alpha1
kind: CrossTenantAgreement
metadata:
  name: alpha-to-beta
spec:
  from:
    tenantRef:
      name: alpha
  to:
    tenantRef:
      name: beta
  scope:
    natsSubjects:
      - "keese.cta.*.events"
    a2aRoles:
      - reader
