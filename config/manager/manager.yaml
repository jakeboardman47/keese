apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: keese
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: keese
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: keese
  replicas: 1
  # Zero-downtime upgrade per docs/designs/14a-olm-channels-upgrades.md.
  # New pod becomes Ready before the old pod terminates; safe with leader
  # election (lease handoff happens during new pod's Readiness gate).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: keese
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        # OpenFGA wiring — mirrored CM populated by dev/bootstrap/openfga/seed.yaml.
        # When unset (empty value from a missing CM), cmd/main.go falls back to
        # NoopRebacWriter; when set, real OpenFGA writers activate. The CM is
        # `optional: true` so the controller still runs in clusters where the
        # OpenFGA bootstrap hasn't been applied (e.g. minimal CI smoke).
        env:
          - name: OPENFGA_API_URL
            value: http://openfga.openfga.svc.cluster.local:8080
          - name: OPENFGA_STORE_ID
            valueFrom:
              configMapKeyRef:
                name: openfga-config
                key: store_id
                optional: true
          - name: OPENFGA_AUTHORIZATION_MODEL_ID
            valueFrom:
              configMapKeyRef:
                name: openfga-config
                key: authorization_model_id
                optional: true
          - name: KEESE_GATEWAY_NS
            value: keese-system
        # Probe schedule vs terminationGracePeriodSeconds (rule 06.8):
        #   initialDelaySeconds(30) + periodSeconds(10) * failureThreshold(3)
        #   = 30 + 30 = 60s headroom.
        # Grace period is 90s (see below), giving 30s margin above the probe
        # window. This ensures the kubelet does not SIGKILL mid-drain.
        # Rationale for 90s grace (not relaxed probes): the drain budget is
        # lease release(5s) + queue drain(30s) + OTEL flush(15s) + buffer(10s)
        # = 60s. At exactly 60s grace the probe window offered zero slack.
        # Bumping grace to 90s adds 30s safety margin without weakening the
        # liveness check, which is the preferable trade-off.
        # See docs/designs/18-process-lifecycle.md and rule 06.8.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      # 90s grace period = 60s drain budget + 30s safety margin.
      # Drain budget: lease release(5s) + queue drain(30s) + OTEL flush(15s)
      # + buffer(10s) = 60s. The extra 30s ensures the probe window (30+30=60s)
      # never races the drain on a loaded node. Rule 06.8 satisfied:
      # 60s probe window < 90s grace. See docs/designs/18-process-lifecycle.md.
      terminationGracePeriodSeconds: 90
