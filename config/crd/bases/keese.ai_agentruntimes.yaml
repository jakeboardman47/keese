                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the controller
                  last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level lifecycle phase.
                enum:
                - Pending
                - Ready
                - Degraded
                - Incompatible
                type: string
              provider:
                description: Provider mirrors the detected implementation name (e.g.
                  "goose").
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
