                    type: object
                  claudeCode:
                    description: ClaudeCode configures the Claude Code runtime provider
                      (stub at v1alpha1).
                    type: object
                  goose:
                    description: Goose configures the goose headless runtime provider.
                    properties:
                      image:
                        description: |-
                          Image is the OCI reference for the goose runtime image.
                          In production this must be digest-pinned (rule 05.12).
                        minLength: 1
                        type: string
                      imageTag:
                        description: ImageTag is informational; admission validates
