      type: string
    - jsonPath: .status.provider
      name: Provider
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentRuntime is the Schema for the agentruntimes API.
          Cluster-scoped; registers a runtime provider implementation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentRuntimeSpec defines the desired state of AgentRuntime.
            properties:
              implementation:
                description: |-
                  Implementation selects and configures the runtime provider.
                  Exactly one sub-field must be set (enforced by CEL XValidation).
                properties:
                  aider:
                    description: Aider configures the aider runtime provider (stub
