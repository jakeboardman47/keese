                        type: string
                      migrationPolicy:
                        description: MigrationPolicy governs how migration severity
                          gates upgrades.
                        properties:
                          maxDeferral:
                            description: |-
                              MaxDeferral is the maximum time this runtime can defer the migration.
                              critical is hard-capped at 1h by the controller.
                            type: string
                          severity:
                            description: 'Severity of migration: critical|high|medium|low.'
                            enum:
                            - critical
                            - high
                            - medium
                            - low
