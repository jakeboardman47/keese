---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: workflowruns.workflow.operator.keese.ai
spec:
  group: workflow.operator.keese.ai
  names:
    kind: WorkflowRun
    listKind: WorkflowRunList
    plural: workflowruns
    shortNames:
    - wfr
    singular: workflowrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.argoPhase
      name: ArgoPhase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkflowRun is the Schema for the workflowruns API.
          It projects an Argo Workflow and manages NATS streams, SA tokens, and CTA checks.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkflowRunSpec defines the desired state of WorkflowRun.
              Immutability of workspaceRef and workflowRef after run start is enforced
              by the admission webhook (VAP rule cannot reference .status from .spec CEL context).
            properties:
              artifacts:
                description: Artifacts declares input artifacts for this run.
                items:
                  description: ArtifactInput declares an input artifact for the WorkflowRun.
                  properties:
                    name:
                      description: Name identifies the artifact.
                      minLength: 1
                      type: string
                    path:
                      description: Path is the artifact location (URL or object-store
                        key).
                      minLength: 1
                      type: string
                  required:
                  - name
                  - path
                  type: object
                type: array
              parameters:
                description: Parameters are name/value pairs forwarded to the Argo
                  Workflow.
                items:
                  description: WorkflowRunParameter is a name/value pair passed to
                    the Argo Workflow.
                  properties:
                    name:
                      description: Name is the parameter name.
                      minLength: 1
                      type: string
                    value:
                      description: Value is the parameter value.
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
              retryBudget:
                default: 10
                description: RetryBudget caps the total number of step retries for
                  this run.
                format: int32
                maximum: 50
                minimum: 1
                type: integer
              supervisionContext:
                description: SupervisionContext configures human-in-the-loop approval
                  gates.
                properties:
                  maxWaitSeconds:
                    default: 3600
                    description: MaxWaitSeconds is how long to wait for approval before
                      failing the step.
                    format: int32
                    minimum: 1
                    type: integer
                  requireApproval:
                    description: |-
                      RequireApproval stops the run at each step boundary until an approval
                      annotation is applied.
                    type: boolean
                  reviewerRef:
                    description: ReviewerRef names a ServiceAccount or Group to notify
                      for approvals.
                    type: string
                type: object
              suspended:
                description: Suspended pauses the run without cancelling it.
                type: boolean
              timeout:
                description: |-
                  Timeout is the maximum duration the run may take (e.g. "1h30m").
                  Immutable after phase != Pending.
                type: string
              workflowRef:
                description: |-
                  WorkflowRef names the Workflow CR this run targets.
                  Immutable after phase != Pending.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              workspaceRef:
                description: |-
                  WorkspaceRef is the owning Workspace CR (same namespace).
                  Immutable after phase != Pending.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - workflowRef
            - workspaceRef
            type: object
            x-kubernetes-validations:
            - message: spec.retryBudget must be >= 1
              rule: self.retryBudget >= 1
          status:
            description: WorkflowRunStatus defines the observed state of WorkflowRun.
            properties:
              argoPhase:
                description: ArgoPhase mirrors the Argo Workflow phase string.
                type: string
              argoWorkflowName:
                description: ArgoWorkflowName is the name of the projected Argo Workflow
                  object.
                type: string
              artifacts:
                description: Artifacts records output artifacts produced by the run.
                items:
                  description: ArtifactOutput records a single output artifact produced
                    by the run.
                  properties:
                    name:
                      description: Name identifies the artifact.
                      type: string
                    nodeID:
                      description: NodeID is the Argo node that produced this artifact.
                      type: string
                    path:
                      description: Path is where the artifact was stored.
                      type: string
                  required:
                  - name
                  - path
                  type: object
                type: array
              conditions:
                description: Conditions holds standard status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: FinishedAt records when the Argo Workflow finished.
                format: date-time
                type: string
              nodes:
                description: Nodes mirrors Argo node statuses for observability.
                items:
                  description: NodeStatus mirrors a single Argo workflow node result.
                  properties:
                    displayName:
                      description: DisplayName is the human-readable node name.
                      type: string
                    finishedAt:
                      description: FinishedAt is when this node completed.
                      format: date-time
                      type: string
                    id:
                      description: ID is the Argo node identifier.
                      type: string
                    message:
                      description: Message carries an optional Argo node message.
                      type: string
                    phase:
                      description: Phase is the Argo node phase string.
                      type: string
                    startedAt:
                      description: StartedAt is when this node started.
                      format: date-time
                      type: string
                  required:
                  - id
                  - phase
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last fully
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the keese-level lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Running
                - Succeeded
                - Failed
                - Error
                type: string
              startedAt:
                description: StartedAt records when the Argo Workflow started.
                format: date-time
                type: string
              tupleCount:
                description: TupleCount records the number of OpenFGA tuples last
                  written.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
