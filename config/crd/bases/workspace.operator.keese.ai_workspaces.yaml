            properties:
              conditions:
                description: Conditions contains detailed status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating
                        details about the transition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation
                        that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating
                        the reason for the condition's last transition.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              networkPolicyName:
                description: NetworkPolicyName is the name of the primary NetworkPolicy
                  for this workspace.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation that the
                  controller last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the current lifecycle phase of the workspace.
                enum:
                - Pending
                - Provisioning
                - Running
                - Idle
                - Evicted
                - Terminating
                type: string
              podRef:
                description: PodRef is a reference to the agent runtime Pod (if Running).
                properties:
                  name:
                    default: ""
                    description: Name of the referent.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              rebacTupleCount:
                description: RebacTupleCount is the number of OpenFGA tuples currently
                  owned by this workspace.
                format: int32
                type: integer
              serviceAccountName:
                description: ServiceAccountName is the name of the ServiceAccount
                  created for this workspace.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
