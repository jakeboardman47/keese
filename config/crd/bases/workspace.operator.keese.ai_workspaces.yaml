---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: workspaces.workspace.operator.keese.ai
spec:
  group: workspace.operator.keese.ai
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
    - ws
    singular: workspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.runtimeRef.name
      name: Runtime
      type: string
    - jsonPath: .spec.interactive
      name: Interactive
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workspace is the Schema for the workspaces API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
            type: string
          metadata:
            type: object
          spec:
            description: WorkspaceSpec defines the desired state of Workspace.
            properties:
              attachGrace:
                description: AttachGrace is the time to wait before considering a
                  session detached.
                type: string
              attachPolicy:
                default: Reuse
                description: AttachPolicy controls how new sessions attach to running
                  pods.
                enum:
                - New
                - Reuse
                type: string
              concurrencyPolicy:
                default: Allow
                description: ConcurrencyPolicy controls how concurrent WorkflowRuns
                  are handled.
                enum:
                - Allow
                - Forbid
                - Replace
                type: string
              editors:
                description: Editors lists user identifiers granted editor access
                  to this workspace.
                items:
                  type: string
                type: array
              guardrailBindingRefs:
                description: GuardrailBindingRefs lists GuardrailBinding objects to
                  enforce in this workspace.
                items:
                  description: LocalObjectReference is a name-only reference to an
                    object in the same namespace.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              interactive:
                default: false
                description: Interactive indicates whether this workspace supports
                  interactive sessions. Immutable after creation.
                type: boolean
              memoryRefs:
                description: MemoryRefs lists Memory objects accessible within this
                  workspace.
                items:
                  description: LocalObjectReference is a name-only reference to an
                    object in the same namespace.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              recipeRef:
                description: RecipeRef references the Recipe to execute in this workspace.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              runtimeRef:
                description: RuntimeRef references the AgentRuntime that will power
                  this workspace.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              sessionMode:
                default: OnDemand
                description: SessionMode controls when the agent runtime pod is active.
                enum:
                - Always
                - OnDemand
                type: string
              sessionStorage:
                anyOf:
                - type: integer
                - type: string
                description: SessionStorage is the requested size of the PVC used
                  for SQLite session state.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              tenantRef:
                description: TenantRef identifies the owning Tenant for this workspace.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: If referring to a piece of an object instead of an
                      entire object, this string should contain a valid JSON/Go field
                      access statement.
                    type: string
                  kind:
                    description: Kind of the referent.
                    type: string
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent.
                    type: string
                  resourceVersion:
                    description: Specific resourceVersion to which this reference is
                      made, if any.
                    type: string
                  uid:
                    description: UID of the referent.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              transportRefs:
                description: TransportRefs lists Transport objects accessible within
                  this workspace.
                items:
                  description: LocalObjectReference is a name-only reference to an
                    object in the same namespace.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              viewers:
                description: Viewers lists user identifiers granted viewer access to
                  this workspace.
                items:
                  type: string
                type: array
            required:
            - runtimeRef
            - tenantRef
            type: object
            x-kubernetes-validations:
            - message: spec.interactive is immutable after creation
              rule: self.interactive == oldSelf.interactive
