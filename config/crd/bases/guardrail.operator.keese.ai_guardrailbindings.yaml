---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: guardrailbindings.guardrail.operator.keese.ai
spec:
  group: guardrail.operator.keese.ai
  names:
    kind: GuardrailBinding
    listKind: GuardrailBindingList
    plural: guardrailbindings
    singular: guardrailbinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.labels.keese\.ai/binding-scope
      name: Scope
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.observedGeneration
      name: ObservedGen
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GuardrailBinding is the Schema for the guardrailbindings API.
          It composes Kyverno policies, OpenFGA tuples, Envoy SecurityPolicy refs,
          recipe hooks, and token budgets into a single CRD with a strictest-wins
          merge lattice spanning Cluster / Tenant / Workspace scopes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GuardrailBindingSpec defines the desired state of GuardrailBinding.
            properties:
              envoy:
                description: Envoy references the Envoy SecurityPolicy for this binding.
                properties:
                  securityPolicyRef:
                    description: SecurityPolicyRef references an Envoy SecurityPolicy
                      in the gateway namespace.
                    properties:
                      name:
                        description: Name is the referenced object's name.
                        type: string
                      namespace:
                        description: Namespace is the referenced object's namespace.
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                type: object
              inherit:
                description: Inherit lists parent GuardrailBindings resolved at merge
                  time.
                items:
                  description: InheritRef is a reference to another GuardrailBinding
                    resolved at merge time.
                  properties:
                    name:
                      description: Name is the GuardrailBinding .metadata.name.
                      type: string
                    namespace:
                      description: Namespace is the GuardrailBinding namespace.
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              kyverno:
                description: |-
                  Kyverno lists Kyverno ClusterPolicy references to compose.
                  Merge rule: union — all named policies apply.
                items:
                  description: KyvernoPolicyRef is a reference to a Kyverno ClusterPolicy
                    by name.
                  properties:
                    policyRef:
                      description: PolicyRef is the ClusterPolicy .metadata.name.
                      type: string
                  required:
                  - policyRef
                  type: object
                type: array
              openfga:
                description: OpenFGA configures the OpenFGA tuple source.
                properties:
                  configMapRef:
                    description: ConfigMapRef points to the ConfigMap holding the
                      OpenFGA tuple definitions.
                    properties:
                      name:
                        description: Name is the referenced object's name.
                        type: string
                      namespace:
                        description: Namespace is the referenced object's namespace.
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                type: object
              recipeHooks:
                description: |-
                  RecipeHooks registers pre- and post-flight hooks.
                  Merge rule: union — hooks from all bindings run.
                items:
                  description: RecipeHook registers a pre- or post-flight hook for
                    recipes.
                  properties:
                    event:
                      description: Event names the trigger point.
                      enum:
                      - beforeToolCall
                      - afterToolCall
                      - onError
                      type: string
                    serviceRef:
                      description: ServiceRef is required; URL field is rejected by
                        VAP.
                      properties:
                        name:
                          description: Name is the Service .metadata.name.
                          type: string
                        namespace:
                          description: Namespace is the Service namespace.
                          type: string
                        path:
                          description: Path is the HTTP path to call on the Service,
                            e.g. "/before-tool-call".
                          type: string
                        port:
                          description: Port is the Service port number.
                          format: int32
                          type: integer
                      required:
                      - name
                      - namespace
                      - path
                      - port
                      type: object
                  required:
                  - event
                  - serviceRef
                  type: object
                type: array
              scope:
                description: Scope defines the tier and associated reference.
                properties:
                  tenantRef:
                    description: TenantRef is required when Type == Tenant.
                    properties:
                      name:
                        description: Name is the referenced object's name.
                        type: string
                      namespace:
                        description: Namespace is the referenced object's namespace.
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  type:
                    description: Type is the scope tier. Immutable after creation
                      (enforced by VAP).
                    enum:
                    - Cluster
                    - Tenant
                    - Workspace
                    type: string
                  workspaceRef:
                    description: WorkspaceRef is required when Type == Workspace.
                    properties:
                      name:
                        description: Name is the referenced object's name.
                        type: string
                      namespace:
                        description: Namespace is the referenced object's namespace.
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                required:
                - type
                type: object
              tokenBudget:
                description: TokenBudget defines per-resource token ceilings.
                properties:
                  input:
                    default: 0
                    description: Input is the maximum number of input tokens (0 =
                      no limit).
                    format: int64
                    type: integer
                  output:
                    default: 0
                    description: Output is the maximum number of output tokens (0
                      = no limit).
                    format: int64
                    type: integer
                  total:
                    default: 0
                    description: Total is the combined input+output ceiling (0 = no
                      limit).
                    format: int64
                    type: integer
                required:
                - input
                - output
                - total
                type: object
              tools:
                description: Tools configures MCP tool allow/deny lists and rate limits.
                properties:
                  allow:
                    description: |-
                      Allow is the allowlist of MCP tool names. Empty means allow all.
                      Merge rule: intersection across all bindings in the scope chain.
                    items:
                      type: string
                    type: array
                  deny:
                    description: |-
                      Deny is the denylist of MCP tool names.
                      Merge rule: union across all bindings in the scope chain.
                    items:
                      type: string
                    type: array
                  rateLimit:
                    description: |-
                      RateLimit applies a request-rate ceiling to all tools in this binding.
                      Merge rule: min(requests) per matching (window, scope) tuple.
                    properties:
                      requests:
                        default: 0
                        description: Requests is the request count threshold (0 =
                          no limit).
                        format: int64
                        type: integer
                      scope:
                        default: sa
                        description: Scope controls per-tenant, per-workspace, or
                          per-service-account limiting.
                        enum:
                        - tenant
                        - workspace
                        - sa
                        type: string
                      window:
                        default: 1m
                        description: Window is the duration string for the rate window,
                          e.g. "1m", "5s".
                        type: string
                    required:
                    - requests
                    - scope
                    - window
                    type: object
                type: object
            required:
            - scope
            type: object
          status:
            description: GuardrailBindingStatus defines the observed state of GuardrailBinding.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectivePolicy:
                description: EffectivePolicy is the merged output consumed by Recipe
                  + Workspace admission.
                properties:
                  observedGeneration:
                    description: |-
                      ObservedGeneration is the generation of this binding at compute time.
                      Used by TOCTOU VAP to reject stale reads.
                    format: int64
                    type: integer
                  tokenBudget:
                    description: TokenBudget is the merged token budget (min across
                      all bindings).
                    properties:
                      input:
                        format: int64
                        type: integer
                      output:
                        format: int64
                        type: integer
                      total:
                        format: int64
                        type: integer
                    required:
                    - input
                    - output
                    - total
                    type: object
                  tools:
                    description: Tools is the merged tool policy.
                    properties:
                      allow:
                        description: Allow is the intersection of all binding allow
                          lists.
                        items:
                          type: string
                        type: array
                      deny:
                        description: Deny is the union of all binding deny lists.
                        items:
                          type: string
                        type: array
                      rateLimit:
                        description: RateLimit is the strictest merged rate limit.
                        properties:
                          requests:
                            format: int64
                            type: integer
                          scope:
                            description: RateLimitScope enumerates the scoping of
                              a rate-limit window.
                            enum:
                            - tenant
                            - workspace
                            - sa
                            type: string
                          window:
                            type: string
                        required:
                        - requests
                        - scope
                        - window
                        type: object
                    type: object
                required:
                - observedGeneration
                type: object
              lastMergeTime:
                description: LastMergeTime is the wall-clock time of the last successful
                  merge.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the binding last
                  reconciled.
                format: int64
                type: integer
              phase:
                description: 'Phase is the high-level status: Ready, Degraded, or
                  Pending.'
                enum:
                - Ready
                - Degraded
                - Pending
                type: string
              rebacTupleCount:
                description: RebacTupleCount records the number of OpenFGA tuples
                  synced on the last reconcile.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
