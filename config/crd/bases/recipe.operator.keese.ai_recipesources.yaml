apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: recipesources.recipe.operator.keese.ai
spec:
  group: recipe.operator.keese.ai
  names:
    kind: RecipeSource
    listKind: RecipeSourceList
    plural: recipesources
    singular: recipesource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.sourceType
      name: Type
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RecipeSource is the Schema for the recipesources API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Cannot be updated.
            type: string
          kind:
            description: Kind is a string value representing the REST resource this object represents.
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RecipeSourceSpec defines the desired state of RecipeSource.
              Exactly one of oci, git, or configMap must be set.
            properties:
              configMap:
                description: ConfigMap specifies an inline ConfigMap source (dev namespaces only).
                properties:
                  name:
                    description: Name is the ConfigMap name.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the ConfigMap namespace.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              git:
                description: Git specifies a git repository source with a pinned commit SHA.
                properties:
                  revision:
                    description: Revision is the full 40-character commit SHA.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  secretRef:
                    description: SecretRef references a Secret containing git credentials.
                    properties:
                      name:
                        default: ""
                        description: Name of the referent.
                        type: string
                    type: object
