                  url:
                    description: URL is the git repository URL.
                    minLength: 1
                    type: string
                required:
                - revision
                - url
                type: object
              oci:
                description: OCI specifies an OCI artifact source (preferred in production).
                properties:
                  digest:
                    description: Digest is the immutable content-addressable digest.
                    type: string
                  registry:
                    description: Registry is the OCI registry hostname.
                    minLength: 1
                    type: string
                  repository:
                    description: Repository is the image repository path.
                    minLength: 1
                    type: string
                  secretRef:
                    description: SecretRef references a Secret containing OCI pull credentials.
                    properties:
                      name:
                        default: ""
                        description: Name of the referent.
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  tag:
