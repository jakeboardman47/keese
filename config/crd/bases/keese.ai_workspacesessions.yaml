---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: workspacesessions.keese.ai
spec:
  group: keese.ai
  names:
    categories:
    - keese
    kind: WorkspaceSession
    listKind: WorkspaceSessionList
    plural: workspacesessions
    shortNames:
    - wsess
    singular: workspacesession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.attachSubject
      name: Subject
      type: string
    - jsonPath: .spec.sessionName
      name: Session
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkspaceSession is the Schema for the workspacesessions API.
          WorkspaceSession is namespace-scoped (same namespace as parent Workspace).
          Name pattern: <workspace>-<subject-hash-16>-<session-name>.
          Design: docs/designs/08b-goose-acp-stdio-k8s.md + docs/designs/08b-ii-session-crd-spec.md
          Spec: docs/specs/workspace.operator.keese.ai-v1alpha1-ii-session.md
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: "WorkspaceSessionSpec defines the desired state of WorkspaceSession.\n\nName
              pattern: <workspace>-<subject-hash-16>-<session-name>.\n\nFinalizer:\n
              \ - finalizers.workspacesession.operator.keese.ai/cleanup\n    Steps:
              Draining → AgentRuntime.Drain (90s) → delete Pod → remove OpenFGA tuples
              → remove finalizer.\n\nSSA fieldOwner: keese-workspacesession-controller\n\nImmutable
              fields (VAP on UPDATE):\n\n\tworkspaceRef, attachSubject, sessionName,
              mode\n\nVAP on CREATE checks (from design 08b-ii):\n\n\tAttachNotAllowedOnNonInteractiveWorkspace,
              DuplicateSession,\n\tAttachSessionNameForbidden, AttachGraceOutOfBounds,\n\tSessionsPerUserLimitExceeded,
              ConcurrentAttachLimitExceeded\n\nRange [0,86400] is enforced per-field
              via +kubebuilder:validation:Minimum/Maximum markers.\nAny spec-level
              CEL rule on optional int32 fields must use !has(self.field) guards to\navoid
              \"no such key\" errors at CRD install time when the field is absent
              (omitempty)."
            properties:
              attachGraceSeconds:
                description: |-
                  AttachGraceSeconds is the idle-before-eviction timeout. Mutable. Range [0,86400].
                  Inherited from Workspace.spec.attachGrace when not set.
                format: int32
                maximum: 86400
                minimum: 0
                type: integer
              attachSubject:
                description: |-
                  AttachSubject is the OpenFGA subject form for the attaching identity, e.g. "user:alice@example.com".
                  Immutable after creation. The controller writes session:<uid>#attached_by@<attachSubject>
                  on Active transition and removes it on Terminating.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: attachSubject is immutable (AttachSubjectImmutable)
                  rule: self == oldSelf
              mode:
                description: |-
                  Mode controls the pod-sharing model: shared, per-user, or per-attach.
                  Inherited from Workspace.spec.sessionMode. Immutable after creation.
                enum:
                - shared
                - per-user
                - per-attach
                type: string
                x-kubernetes-validations:
                - message: mode is immutable (SessionModeImmutable)
                  rule: self == oldSelf
              preserveOnPodFailure:
                description: |-
                  PreserveOnPodFailure keeps the CR alive in a Failed state when the pod crashes,
                  requiring a manual delete. Mutable.
                type: boolean
              sessionName:
                default: default
                description: |-
                  SessionName is the user-visible session identifier. Defaults to "default".
                  Immutable after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: sessionName is immutable (SessionNameImmutable)
                  rule: self == oldSelf
              workspaceRef:
                description: |-
                  WorkspaceRef is the name of the parent Workspace in the same namespace.
                  The Workspace must have spec.interactive: true (VAP-enforced).
                  Immutable after creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: workspaceRef is immutable (WorkspaceRefImmutable)
                  rule: self == oldSelf
            required:
            - attachSubject
            - mode
            - sessionName
            - workspaceRef
            type: object
          status:
            description: WorkspaceSessionStatus defines the observed state of WorkspaceSession.
            properties:
              attachedAt:
                description: AttachedAt is the UTC timestamp when the first ACP client
                  connected.
                format: date-time
                type: string
              attachedClientCount:
                description: |-
                  AttachedClientCount is the number of currently connected ACP clients.
                  >1 is valid in shared and per-user mode (multiple terminals, same session).
                format: int32
                type: integer
              conditions:
                description: Conditions reports readiness and attach state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastActivityAt:
                description: LastActivityAt is the UTC timestamp of the most recent
                  ACP frame exchange.
                format: date-time
                type: string
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the most recent
                  successful reconcile.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation successfully
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the lifecycle phase of the session.
                enum:
                - Pending
                - Attaching
                - Active
                - Draining
                - Evicted
                - Terminating
                type: string
              podRef:
                description: PodRef references the backing Pod for this session.
                properties:
                  name:
                    description: Name of the Pod.
                    type: string
                  uid:
                    description: UID of the Pod (used for event correlation).
                    type: string
                required:
                - name
                type: object
              tokenBudgetRef:
                description: TokenBudgetRef references the per-session TokenBudget
                  (populated in split sessionMode).
                properties:
                  name:
                    description: Name of the TokenBudget.
                    type: string
                required:
                - name
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
