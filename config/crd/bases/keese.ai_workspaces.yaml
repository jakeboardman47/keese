---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: workspaces.keese.ai
spec:
  group: keese.ai
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
    - ws
    singular: workspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .spec.runtimeRef.name
      name: Runtime
      type: string
    - jsonPath: .spec.interactive
      name: Interactive
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workspace is the Schema for the workspaces API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkspaceSpec defines the desired state of Workspace.
            properties:
              a2a:
                description: |-
                  A2A enables the agent-to-agent (A2A) HTTP/SSE endpoint on this
                  Workspace and selects its trust scope. When unset, the Workspace
                  exposes no A2A endpoint (the default-deny posture). See E2.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled turns the A2A endpoint on. When true and scope is
                      intra-tenant, the Workspace controller writes the self ReBAC tuple
                      `workspace:W#a2a_callable_by@workspace:W`; the keese-authz ext_authz
                      service then resolves `workspace:W#a2a_callable_by@workspace:<caller>`
                      per inbound A2A request (fail-closed). Cross-tenant scope additionally
                      requires an Approved CrossTenantAgreement before any tuple is written.
                    type: boolean
                  port:
                    default: 8080
                    description: |-
                      Port is the A2A HTTP/SSE listener port served by the bridge sidecar.
                      Must be in the unprivileged range 1024–65535. Defaults to 8080.
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                  scope:
                    default: intra-tenant
                    description: Scope selects the trust boundary for inbound A2A
                      calls.
                    enum:
                    - intra-tenant
                    - cross-tenant
                    type: string
                type: object
              attachGrace:
                default: 30s
                description: AttachGrace is the time to wait before considering a
                  session detached.
                type: string
              attachPolicy:
                default: Reuse
                description: AttachPolicy controls how new sessions attach to running
                  pods.
                enum:
                - New
                - Reuse
                type: string
              concurrencyPolicy:
                default: Allow
                description: ConcurrencyPolicy controls how concurrent WorkflowRuns
                  are handled.
                enum:
                - Allow
                - Forbid
                - Replace
                type: string
              editors:
                description: Editors lists user identifiers granted editor access
                  to this workspace.
                items:
                  type: string
                type: array
              egress:
                description: |-
                  Egress carries the per-workspace egress authorization config —
                  today, the allowlist of OpenFGA tool names this workspace's
                  session pods may call. The Workspace controller writes one
                  `tool:<name>#allowed_in@workspace:<wsuid>` ReBAC tuple per
                  element; the keese-authz ext_authz service then resolves
                  `tool:<name>#can_call@<subject>` per request.
                properties:
                  allowedTools:
                    description: |-
                      AllowedTools is the OpenFGA tool-name allowlist for this
                      workspace. Each entry must match the toolName field of an
                      existing ToolBinding (cluster) or the namespaced name of a
                      WorkspaceTool. The Workspace controller writes one ReBAC
                      tuple per element on Sync and deletes them on cleanup.
                    items:
                      type: string
                    type: array
                type: object
              guardrailBindingRefs:
                description: GuardrailBindingRefs lists GuardrailBinding objects to
                  enforce in this workspace.
                items:
                  description: |-
                    LocalObjectReference is a name-only reference to an object in the same namespace.
                    Shared across Workspace, Workflow, and other keese.ai types.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              interactive:
                default: false
                description: |-
                  Interactive indicates whether this workspace supports interactive (human-in-the-loop) sessions.
                  Immutable after creation (enforced by XValidation above).
                type: boolean
              memoryRefs:
                description: MemoryRefs lists Memory objects accessible within this
                  workspace.
                items:
                  description: |-
                    LocalObjectReference is a name-only reference to an object in the same namespace.
                    Shared across Workspace, Workflow, and other keese.ai types.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              recipeRef:
                description: RecipeRef references the Recipe to execute in this workspace.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              runtimeRef:
                description: |-
                  RuntimeRef references the AgentRuntime that will power this workspace.
                  The runtime controller's Bootstrap method is called to initialize the pod spec.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              sessionMode:
                default: OnDemand
                description: SessionMode controls when the agent runtime pod is active.
                enum:
                - Always
                - OnDemand
                type: string
              sessionStorage:
                anyOf:
                - type: integer
                - type: string
                description: SessionStorage is the requested size of the PVC used
                  for SQLite session state.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              tenantRef:
                description: |-
                  TenantRef identifies the owning Tenant for this workspace.
                  References metav1.ObjectReference until tenancy CRD is generated;
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              transportRefs:
                description: TransportRefs lists Transport objects (NATS streams,
                  etc.) accessible within this workspace.
                items:
                  description: |-
                    LocalObjectReference is a name-only reference to an object in the same namespace.
                    Shared across Workspace, Workflow, and other keese.ai types.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              viewers:
                description: Viewers lists user identifiers granted viewer access
                  to this workspace.
                items:
                  type: string
                type: array
            required:
            - runtimeRef
            - tenantRef
            type: object
            x-kubernetes-validations:
            - message: spec.interactive is immutable after creation
              rule: self.interactive == oldSelf.interactive
          status:
            description: WorkspaceStatus defines the observed state of Workspace.
            properties:
              conditions:
                description: Conditions contains detailed status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              networkPolicyName:
                description: NetworkPolicyName is the name of the primary NetworkPolicy
                  (default-deny) for this workspace.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation that the
                  controller last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the current lifecycle phase of the workspace.
                enum:
                - Pending
                - Provisioning
                - Running
                - Idle
                - Evicted
                - Terminating
                type: string
              podRef:
                description: PodRef is a reference to the agent runtime Pod (if Running).
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              rebacTupleCount:
                description: |-
                  RebacTupleCount is the number of OpenFGA tuples currently owned by this workspace.
                  Recorded for debuggability.
                format: int32
                type: integer
              serviceAccountName:
                description: ServiceAccountName is the name of the ServiceAccount
                  created for this workspace.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
