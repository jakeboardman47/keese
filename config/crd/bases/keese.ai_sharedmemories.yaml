---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: sharedmemories.keese.ai
spec:
  group: keese.ai
  names:
    kind: SharedMemory
    listKind: SharedMemoryList
    plural: sharedmemories
    shortNames:
    - smem
    singular: sharedmemory
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.provider.type
      name: Provider
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SharedMemory is the Schema for the sharedmemories API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SharedMemorySpec defines the desired state of SharedMemory.
            properties:
              embeddingDim:
                description: |-
                  embeddingDim is the dimensionality of stored embeddings.
                  Immutable after creation; enforced by the EmbeddingDimImmutable VAP.
                format: int32
                maximum: 65536
                minimum: 1
                type: integer
              provider:
                description: |-
                  provider is the discriminated one-of backend configuration.
                  Same semantics as Memory.spec.provider.
                properties:
                  mem0:
                    description: mem0 configures the Mem0 hosted provider.
                    properties:
                      apiEndpoint:
                        description: apiEndpoint overrides the default Mem0 SaaS endpoint.
                        type: string
                      credentialSecretRef:
                        description: |-
                          credentialSecretRef names the K8s Secret (populated by ExternalSecrets) that
                          is mounted as a projected file at /var/run/keese/secrets/<name>.
                        minLength: 1
                        type: string
                    required:
                    - credentialSecretRef
                    type: object
                  neo4j:
                    description: neo4j configures the Neo4j graph backend.
                    properties:
                      credentialSecretRef:
                        description: |-
                          credentialSecretRef names the K8s Secret containing neo4j credentials, mounted
                          as a projected file per rule 05.7.
                        type: string
                      uri:
                        description: |-
                          uri is the external Bolt URI for the Neo4j instance. Leave empty to
                          provision an in-cluster StatefulSet ("<memory>-neo4j"); credentials then
                          come from credentialSecretRef.
                        type: string
                    type: object
                  pgvector:
                    description: pgvector configures the PostgreSQL pgvector backend.
                    properties:
                      dsnSecretRef:
                        description: |-
                          dsn is a reference to a K8s Secret key containing the PostgreSQL DSN.
                          The secret is mounted as a projected file — never as an env var (rule 05.7).
                        minLength: 1
                        type: string
                      tableName:
                        default: keese_memory
                        description: tableName is the pgvector table to use.
                        type: string
                    required:
                    - dsnSecretRef
                    type: object
                  qdrant:
                    description: qdrant configures the Qdrant vector backend.
                    properties:
                      collectionName:
                        description: collectionName is the Qdrant collection to use.
                        minLength: 1
                        type: string
                      credentialSecretRef:
                        description: |-
                          credentialSecretRef names the K8s Secret containing the Qdrant API key, mounted
                          as a projected file per rule 05.7.
                        type: string
                      endpoint:
                        description: |-
                          endpoint is the external Qdrant gRPC endpoint. Leave empty to provision
                          an in-cluster StatefulSet ("<memory>-qdrant"); credentials then come
                          from credentialSecretRef.
                        type: string
                      replicas:
                        default: 1
                        description: replicas is the replication factor for the collection.
                          Must be ≥2 outside dev (HA VAP).
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - collectionName
                    type: object
                  redis:
                    description: redis configures the Redis backend.
                    properties:
                      address:
                        description: |-
                          address is the external Redis endpoint (host:port). Leave empty to
                          provision an in-cluster StatefulSet + headless Service ("<memory>-redis")
                          in the Memory's namespace; credentials then come from credentialSecretRef.
                        type: string
                      credentialSecretRef:
                        description: |-
                          credentialSecretRef names the K8s Secret containing redis credentials, mounted
                          as a projected file per rule 05.7.
                        type: string
                      replicas:
                        default: 1
                        description: replicas is the number of Redis replicas. Must
                          be ≥2 outside dev namespaces (HA VAP).
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                  sqlite:
                    description: sqlite configures the SQLite-on-PVC backend.
                    properties:
                      reclaimPolicy:
                        default: Retain
                        description: reclaimPolicy controls whether the PVC is deleted
                          or retained on Memory deletion.
                        enum:
                        - Retain
                        - Delete
                        type: string
                      storageClassName:
                        description: storageClassName selects the StorageClass for
                          the PVC.
                        type: string
                      storageSize:
                        default: 1Gi
                        description: storageSize is the PVC storage request for the
                          SQLite database file.
                        type: string
                    type: object
                  type:
                    allOf:
                    - enum:
                      - sqlite
                      - redis
                      - qdrant
                      - pgvector
                      - neo4j
                      - mem0
                      - zep
                    - enum:
                      - sqlite
                      - redis
                      - qdrant
                      - pgvector
                      - neo4j
                      - mem0
                      - zep
                    description: type discriminates the active provider field.
                    type: string
                  zep:
                    description: zep configures the Zep hosted provider.
                    properties:
                      apiEndpoint:
                        description: apiEndpoint overrides the default Zep SaaS endpoint.
                        type: string
                      credentialSecretRef:
                        description: |-
                          credentialSecretRef names the K8s Secret (populated by ExternalSecrets) that
                          is mounted as a projected file at /var/run/keese/secrets/<name>.
                        minLength: 1
                        type: string
                    required:
                    - credentialSecretRef
                    type: object
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: exactly one of sqlite|redis|qdrant|pgvector|neo4j|mem0|zep
                    must be set
                  rule: '[has(self.sqlite),has(self.redis),has(self.qdrant),has(self.pgvector),has(self.neo4j),has(self.mem0),has(self.zep)].exists_one(x,x)'
              sharedWith:
                description: |-
                  sharedWith is the list of Workspaces that receive access grants.
                  Each element causes the controller to write memory.reader or memory.writer
                  OpenFGA tuples for the workspace's ServiceAccount.
                  Mutations require tenant admin authz (SharedMemoryMutationAuthz VAP).
                items:
                  description: WorkspaceRef is a reference to a Workspace that receives
                    shared access.
                  properties:
                    access:
                      default: reader
                      description: |-
                        access controls whether the workspace gets reader or writer access.
                        The controller writes memory.reader or memory.writer ReBAC tuples accordingly.
                      enum:
                      - reader
                      - writer
                      type: string
                    name:
                      description: name is the Workspace name.
                      minLength: 1
                      type: string
                    namespace:
                      description: namespace is the namespace containing the Workspace.
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              tenantRef:
                description: |-
                  tenantRef is the owning Tenant name (cluster-level reference).
                  Only the tenant admin may mutate sharedWith[]; enforced by the
                  SharedMemoryMutationAuthz VAP which calls OpenFGA (≤15ms 1-hop).
                minLength: 1
                type: string
            required:
            - provider
            - tenantRef
            type: object
            x-kubernetes-validations:
            - message: exactly one of sqlite|redis|qdrant|pgvector|neo4j|mem0|zep
                must be set
              rule: '[has(self.provider.sqlite),has(self.provider.redis),has(self.provider.qdrant),has(self.provider.pgvector),has(self.provider.neo4j),has(self.provider.mem0),has(self.provider.zep)].exists_one(x,x)'
          status:
            description: SharedMemoryStatus defines the observed state of SharedMemory.
            properties:
              backendProvisioned:
                description: backendProvisioned is true when the backend resource
                  has been confirmed present.
                type: boolean
              conditions:
                description: conditions holds standard Kubernetes status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the .metadata.generation the controller
                  last reconciled.
                format: int64
                type: integer
              phase:
                description: phase is the current lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - Terminating
                type: string
              rebacTupleCount:
                description: rebacTupleCount is the number of OpenFGA tuples currently
                  written for this SharedMemory.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
