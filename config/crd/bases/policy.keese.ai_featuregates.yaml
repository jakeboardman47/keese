---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: featuregates.policy.keese.ai
spec:
  group: policy.keese.ai
  names:
    kind: FeatureGate
    listKind: FeatureGateList
    plural: featuregates
    shortNames:
    - fg
    singular: featuregate
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.stage
      name: Stage
      type: string
    - jsonPath: .status.effective
      name: Effective
      type: boolean
    - jsonPath: .spec.override
      name: Override
      type: boolean
    - jsonPath: .spec.restartRequired
      name: Restart
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FeatureGate is the Schema for the featuregates API. See design
          27.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FeatureGateSpec defines the desired state of a FeatureGate.
            properties:
              description:
                description: |-
                  Description is a one-line human-readable summary of what the
                  gate controls. Surfaces in `make featuregate-list` and
                  `kubectl describe`.
                maxLength: 512
                minLength: 1
                type: string
              override:
                description: |-
                  Override flips the gate's effective value. nil → use the
                  stage's default. true/false → unconditional. Forbidden on
                  stage=ga or stage=deprecated (the in-process eval ignores
                  the gate either way; the CRD enforces this via XValidation).
                type: boolean
              owners:
                description: |-
                  Owners lists the binaries that consume this gate. Used by the
                  controller to scope drift alerts and by `featuregate-list` to
                  show consumers. Free-form; convention is the binary's image
                  name (e.g. "keese-cosign-webhook", "keese-controller-manager").
                items:
                  type: string
                maxItems: 32
                type: array
              restartRequired:
                default: false
                description: |-
                  RestartRequired marks gates whose flip cannot take effect
                  mid-process — webhook re-registration, leader election,
                  listener port changes. The controller emits a
                  Event(Reason=RestartRequired) on transition; we do not
                  auto-restart (rule 06 — process lifecycle is operator-controlled).
                type: boolean
              stage:
                description: |-
                  Stage carries the gate's lifecycle stage; alpha gates default
                  to off, beta to on. See design 27 §1.
                enum:
                - alpha
                - beta
                - ga
                - deprecated
                type: string
            required:
            - description
            - stage
            type: object
            x-kubernetes-validations:
            - message: override may not be set on a ga-stage gate; the code path is
                unconditional
              rule: self.stage != 'ga' || !has(self.override)
            - message: override may not be set on a deprecated-stage gate; remove
                the gate or revert promotion
              rule: self.stage != 'deprecated' || !has(self.override)
          status:
            description: FeatureGateStatus reports the projected effective state.
            properties:
              conditions:
                description: |-
                  Conditions holds the standard Kubernetes condition list.
                  Types: Ready, RestartRequired.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consumers:
                description: |-
                  Consumers is a rolling-window list of binaries that have read
                  the gate at least once recently. Populated from
                  OpenFeature-hook telemetry sent back via the controller's
                  counter. Bounded to 32 entries.
                items:
                  type: string
                maxItems: 32
                type: array
              effective:
                description: |-
                  Effective is the value actually projected into the
                  keese-features ConfigMap: spec.override ?? defaultFor(stage).
                type: boolean
              lastTransitionTime:
                description: |-
                  LastTransitionTime is the time the effective value last
                  changed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
