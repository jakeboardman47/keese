resources:
# core (`keese.ai`) — workload primitives.
- bases/keese.ai_tenants.yaml
- bases/keese.ai_workspaces.yaml
- bases/keese.ai_workspaceshares.yaml
- bases/keese.ai_workspacesessions.yaml
- bases/keese.ai_workflows.yaml
- bases/keese.ai_workflowruns.yaml
- bases/keese.ai_agentruntimes.yaml
- bases/keese.ai_runtimeextensions.yaml
- bases/keese.ai_memories.yaml
- bases/keese.ai_sharedmemories.yaml
- bases/keese.ai_recipes.yaml
- bases/keese.ai_recipesources.yaml
- bases/keese.ai_transports.yaml
# authz (`authz.keese.ai`) — access control.
- bases/authz.keese.ai_oidcproviders.yaml
- bases/authz.keese.ai_crosstenantagreements.yaml
- bases/authz.keese.ai_guardrailbindings.yaml
- bases/authz.keese.ai_toolbindings.yaml
- bases/authz.keese.ai_workspacetools.yaml
# policy (`policy.keese.ai`) — quantitative constraints.
- bases/policy.keese.ai_tokenbudgets.yaml
