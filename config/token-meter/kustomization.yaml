#
# keese-token-meter metering hop (ADR 30 / CH5b). Bundles the meter
# Deployment/Service, the dev metering Prometheus that scrapes it, and the
# fail-closed NetworkPolicies that pin both ends of the hop (rule 05.5). All
# objects land in the `monitoring` namespace so the reconciler's PromQL client
# (http://prometheus.monitoring.svc:9090) resolves without cross-namespace
# routing.
#
# Applied SSA by `make bootstrap-infra` (dev/bootstrap/token-meter overlay).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - prometheus-config.yaml
  - prometheus.yaml
