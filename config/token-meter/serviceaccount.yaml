#
# The meter needs no Kubernetes API access — it only serves HTTP (/ingest +
# /metrics). The SA carries no RBAC and the pod sets
# automountServiceAccountToken: false (rule 05.1: no kubeconfig/API token in a
# pod that does not call the API server).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keese-token-meter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: keese-token-meter
    app.kubernetes.io/component: metering
automountServiceAccountToken: false
