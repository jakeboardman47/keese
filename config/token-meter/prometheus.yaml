#
# Minimal dev Prometheus — the authoritative consumed-token store the
# TokenBudget reconciler queries (10b). It scrapes only the keese-token-meter
# (prometheus-config.yaml) and serves PromQL at
# http://prometheus.monitoring.svc:9090, the exact endpoint the reconciler's
# PromQL client targets (internal/controller/policy/prom_http.go). CH5c wires
# the reconciler to this Service and removes the EH7 stub.
#
# This is the dev-loop store only. Production uses the 10a Prometheus pipeline.
# Image pinned by digest (rule 05.12); the tag is recorded in the comment for
# the human reader. Storage is ephemeral (emptyDir): the meter's counters are
# monotonic and increase()-windowed, so a restart re-derives consumption from
# the live series — no durable Prometheus TSDB is required for the dev loop.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metering-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: metering-store
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          # prom/prometheus:v2.54.1 — pinned by digest (rule 05.12 / rule 02
          # supply-chain). Dev loop image; prod uses the 10a pipeline.
          image: prom/prometheus@sha256:11a4565c1c14ce302cf06e3c92f81e16a6db1a8d54fcce91ce8b25d36c11a1da
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --web.listen-address=:9090
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: tsdb
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: tsdb
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metering-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
