# This rule is not used by the project keese itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to memory.operator.keese.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: keese
    app.kubernetes.io/managed-by: kustomize
  name: memory-sharedmemory-viewer-role
rules:
- apiGroups:
  - memory.operator.keese.ai
  resources:
  - sharedmemories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - memory.operator.keese.ai
  resources:
  - sharedmemories/status
  verbs:
  - get
