# This rule is not used by the project keese itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over runtime.operator.keese.ai.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: keese
    app.kubernetes.io/managed-by: kustomize
  name: runtime-runtimeextension-admin-role
rules:
- apiGroups:
  - runtime.operator.keese.ai
  resources:
  - runtimeextensions
  verbs:
  - '*'
- apiGroups:
  - runtime.operator.keese.ai
  resources:
  - runtimeextensions/status
  verbs:
  - get
