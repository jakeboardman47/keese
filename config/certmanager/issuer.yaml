#
# Self-signed Issuer for the webhook Certificate. In production, replace with
# a CA-backed ClusterIssuer; self-signed is sufficient for dev and CI.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: system
  labels:
    app.kubernetes.io/name: keese
    app.kubernetes.io/managed-by: kustomize
spec:
  selfSigned: {}
