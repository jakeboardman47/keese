      deployments:
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: keese
          control-plane: controller-manager
        name: keese-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: keese
              control-plane: controller-manager
          strategy:
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
            type: RollingUpdate
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: keese
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                command:
                - /manager
                env:
                - name: OPENFGA_API_URL
                  value: http://openfga.openfga.svc.cluster.local:8080
                - name: OPENFGA_STORE_ID
                  valueFrom:
                    configMapKeyRef:
                      key: store_id
                      name: openfga-config
                      optional: true
                - name: OPENFGA_AUTHORIZATION_MODEL_ID
                  valueFrom:
                    configMapKeyRef:
                      key: authorization_model_id
                      name: openfga-config
                      optional: true
                - name: KEESE_GATEWAY_NS
                  value: keese-system
                image: controller:latest
                livenessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 30
                  periodSeconds: 10
                name: manager
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: keese-controller-manager
              terminationGracePeriodSeconds: 90
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
