                        name:
                          description: Name of the referenced object.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - image
                  - name
                  type: object
                minItems: 1
                type: array
              triggers:
                description: Triggers declares how this Workflow is activated.
                items:
                  description: |-
                    WorkflowTrigger is a discriminated one-of trigger configuration.
                    Exactly one of Cron / KnativeTrigger / NATSSubscription / HTTPWebhook must be set.
                  properties:
                    cron:
                      description: Cron configures a CronJob-based trigger.
                      properties:
                        schedule:
                          description: Schedule is a cron expression (e.g. "0 * *
                            * *").
                          minLength: 1
                          type: string
                        suspend:
                          description: Suspend disables the CronJob without removing
                            it.
                          type: boolean
                        timezone:
                          description: Timezone in IANA format (e.g. "UTC", "America/New_York").
                          type: string
                      required:
                      - schedule
                      type: object
                    httpWebhook:
                      description: HTTPWebhook configures an HTTPRoute-based webhook
                        trigger.
                      properties:
                        path:
                          description: Path is the HTTP path that will activate this
                            workflow (e.g. "/trigger").
                          minLength: 1
                          pattern: ^/
                          type: string
                        secretRef:
                          description: SecretRef names a Secret containing the HMAC
                            shared key for webhook verification.
                          properties:
                            name:
                              description: Name of the referenced object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - path
                      type: object
                    knativeTrigger:
                      description: KnativeTrigger configures a Knative Eventing Trigger.
                      properties:
                        brokerRef:
                          description: BrokerRef names the Knative Broker in the same
                            namespace.
                          minLength: 1
                          type: string
                        filter:
                          additionalProperties:
                            type: string
                          description: Filter is a CloudEvent attribute filter (optional).
                          type: object
                      required:
                      - brokerRef
                      type: object
                    natsSubscription:
                      description: NATSSubscription configures a NATS JetStream trigger.
                      properties:
                        durable:
                          description: Durable names the durable consumer.
                          type: string
                        streamName:
                          description: StreamName is the JetStream stream to consume
                            from.
                          minLength: 1
                          type: string
                        subject:
                          description: Subject is the NATS subject pattern.
                          minLength: 1
                          type: string
                      required:
                      - streamName
                      - subject
                      type: object
                    type:
                      description: Type discriminates which variant is populated.
                      enum:
                      - Cron
                      - KnativeTrigger
                      - NATSSubscription
                      - HTTPWebhook
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one trigger variant must be set
                    rule: '(has(self.cron) ? 1 : 0) + (has(self.knativeTrigger) ?
                      1 : 0) + (has(self.natsSubscription) ? 1 : 0) + (has(self.httpWebhook)
                      ? 1 : 0) == 1'
                type: array
            required:
            - entrypoint
            - templates
            type: object
            x-kubernetes-validations:
            - message: spec.templates must have at least one entry
              rule: size(self.templates) >= 1
          status:
            description: WorkflowStatus defines the observed state of Workflow.
            properties:
              conditions:
                description: Conditions holds standard status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last fully
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase summarises the current lifecycle state.
                enum:
                - Pending
                - Projecting
                - Ready
                - Degraded
                - Deleting
                type: string
              runCount:
                description: RunCount is the total number of WorkflowRuns created
                  against this Workflow.
                format: int64
                type: integer
              tupleCount:
                description: TupleCount records the number of OpenFGA tuples last
                  written.
                format: int32
                type: integer
              workflowTemplateRef:
                description: WorkflowTemplateRef is the name of the projected Argo
                  WorkflowTemplate.
                type: string
            type: object
        required:
        - spec
        type: object
