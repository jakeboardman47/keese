    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Workflow is the Schema for the workflows API.
          It projects an Argo WorkflowTemplate and manages triggers and outputs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkflowSpec defines the desired state of Workflow.
            properties:
              artifactStoreRef:
                description: |-
                  ArtifactStoreRef names an artifact backend Secret/ConfigMap.
                  Falls back to Tenant.spec.artifactStoreRef when absent.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              concurrencyPolicy:
                default: Allow
                description: |-
                  ConcurrencyPolicy controls what happens when a new WorkflowRun
                  arrives while an existing run is active.
                enum:
                - Allow
                - Forbid
                - Replace
                type: string
              defaultRetryBudget:
                description: DefaultRetryBudget applies to all steps unless overridden
                  per-step.
                properties:
                  backoffSeconds:
                    default: 10
                    description: BackoffSeconds is the base back-off between retries.
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  limit:
                    default: 10
                    description: Limit is the maximum number of step retries across
                      the whole workflow.
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                required:
                - limit
                type: object
              entrypoint:
                description: Entrypoint names the template to run first.
                minLength: 1
                type: string
              outputs:
                description: Outputs declares where results are sent after completion.
                items:
                  description: WorkflowOutput is a discriminated one-of output configuration.
                  properties:
                    githubPR:
                      description: GitHubPR configures a GitHub PR output.
                      properties:
                        repo:
                          description: Repo is the GitHub repository in "owner/name"
                            format.
                          minLength: 1
                          type: string
                        tokenSecretRef:
                          description: TokenSecretRef names a Secret containing the
                            GitHub token.
                          properties:
                            name:
                              description: Name of the referenced object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - repo
                      - tokenSecretRef
                      type: object
                    knativeSink:
                      description: KnativeSink configures a Knative sink output.
                      properties:
                        ref:
                          description: Ref is a reference to a Knative Addressable
                            (Broker, Channel, Service).
                          minLength: 1
                          type: string
                      required:
                      - ref
                      type: object
                    name:
                      description: Name is a unique identifier for this output.
                      minLength: 1
                      type: string
                    natsPublish:
                      description: NATSPublish configures a NATS publish output.
                      properties:
                        subject:
                          description: Subject is the NATS subject to publish to.
                          minLength: 1
                          type: string
                      required:
                      - subject
                      type: object
                    s3:
                      description: S3 configures S3 artifact output.
                      properties:
                        bucket:
                          description: Bucket is the S3 bucket name.
                          minLength: 1
                          type: string
                        credentialsSecretRef:
                          description: CredentialsSecretRef names a Secret with S3
                            credentials.
                          properties:
                            name:
                              description: Name of the referenced object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        keyPrefix:
                          description: KeyPrefix is the object key prefix.
                          type: string
                      required:
                      - bucket
                      type: object
                    type:
                      description: Type discriminates which variant is populated.
                      enum:
                      - KnativeSink
                      - NATSPublish
                      - S3
                      - GitHubPR
                      type: string
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one output variant must be set
                    rule: '(has(self.knativeSink) ? 1 : 0) + (has(self.natsPublish)
                      ? 1 : 0) + (has(self.s3) ? 1 : 0) + (has(self.githubPR) ? 1
                      : 0) == 1'
                type: array
              templates:
                description: |-
                  Templates is the ordered list of step templates.
                  Must contain at least one entry.
                items:
                  description: |-
                    WorkflowTemplateStep is one step inside a WorkflowTemplate.
                    It maps 1:1 onto an Argo WorkflowTemplate step.
                  properties:
                    args:
                      description: Args supplies arguments to the container.
                      items:
                        type: string
                      type: array
                    command:
                      description: Command overrides the container entrypoint.
                      items:
                        type: string
                      type: array
                    guardrailBindingRefs:
                      description: GuardrailBindingRefs names GuardrailBinding CRs
                        applied to this step.
                      items:
                        description: LocalObjectReference is a reference to an object
                          in the same namespace.
                        properties:
                          name:
                            description: Name of the referenced object.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    image:
                      description: Image is the container image to run for this step.
                      minLength: 1
                      type: string
                    name:
                      description: Name is a unique identifier for this step within
                        the template.
                      maxLength: 63
                      minLength: 1
                      type: string
                    retryLimit:
                      default: 3
                      description: RetryLimit caps the number of retries for this
                        step.
                      format: int32
                      maximum: 10
                      minimum: 0
                      type: integer
                    transportRef:
                      description: |-
                        TransportRef names a Transport CR in the same namespace that
                        provides the egress channel for this step.
