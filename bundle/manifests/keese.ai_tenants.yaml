apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: tenants.keese.ai
spec:
  group: keese.ai
  names:
    categories:
    - keese
    kind: Tenant
    listKind: TenantList
    plural: tenants
    shortNames:
    - tenant
    singular: tenant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.namespaces
      name: Namespaces
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tenant is the Schema for the tenants API.
          Tenant is cluster-scoped; its name IS the OpenFGA identity key.
          Design: docs/designs/24-tenant-crd.md + docs/designs/24b-tenant-crd.md
          Spec: docs/specs/keese.ai-v1alpha1-ii-tenant.md
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TenantSpec defines the desired state of Tenant.

              Finalizers:
                - finalizers.tenant.keese.ai/workspaces  — prevent deletion while Workspaces live
                - finalizers.tenant.keese.ai/namespaces  — prevent label removal while Workspaces live
                - finalizers.tenant.keese.ai/agreements  — drain CrossTenantAgreements before delete
            properties:
              adminSubjects:
                description: |-
                  AdminSubjects are the users/groups with admin rights on this tenant.
                  At least one entry is required (VAP-enforced).
                items:
                  description: TenantSubject references a Kubernetes or OIDC user/group/service-account.
                  properties:
                    kind:
                      description: Kind of the subject — User, Group, or ServiceAccount.
                      enum:
                      - User
                      - Group
                      - ServiceAccount
                      type: string
                    name:
                      description: Name is the OIDC email, group name, or service-account
                        name.
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                minItems: 1
                type: array
              artifactStoreRef:
                description: |-
                  ArtifactStoreRef references the artifact store for this tenant.
                  Must resolve when set (webhook-enforced).
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace where the referenced object lives.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              auditArgumentsRedacted:
                description: |-
                  AuditArgumentsRedacted opts in to redacting agent call arguments in audit logs
                  (PII-safe default is false).
                type: boolean
              capsuleTenantRef:
                description: |-
                  CapsuleTenantRef delegates namespace aggregation to a Capsule Tenant (Mode B).
                  Immutable while any namespace is live. When set, namespaceSelector is silently
                  ignored with a warning event NamespaceSelectorIgnoredInModeB.
                properties:
                  name:
                    description: Name of the Capsule Tenant. Immutable while any namespace
                      is live.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: capsuleTenantRef.name is immutable
                      rule: self == oldSelf
                required:
                - name
                type: object
              credentialPoolRef:
                description: |-
                  CredentialPoolRef references the credential pool for this tenant.
                  Must resolve when set (webhook-enforced).
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace where the referenced object lives.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              dedicatedGateway:
                description: |-
                  DedicatedGateway provisions a per-tenant Envoy AI Gateway instance.
                  Cannot be toggled while status.namespaces[] is non-empty (VAP-enforced).
                type: boolean
              defaultCallRetryBudget:
                description: DefaultCallRetryBudget constrains per-call retry policy
                  for workspaces in this tenant.
                properties:
                  maxRetries:
                    description: MaxRetries is the maximum number of retries per call.
                      0 = no retries.
                    format: int32
                    minimum: 0
                    type: integer
                  perCallTimeout:
                    description: PerCallTimeout is the per-attempt timeout as a duration
                      string (e.g. "30s").
                    pattern: ^([0-9]+(s|m|h))+$
                    type: string
                required:
                - maxRetries
                type: object
                x-kubernetes-validations:
                - message: perCallTimeout must be >= 1s when set
                  rule: '!has(self.perCallTimeout) || duration(self.perCallTimeout)
                    >= duration(''1s'')'
              defaultGuardrailBindings:
                description: DefaultGuardrailBindings lists names of GuardrailBinding
                  CRs inherited by workspaces.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              defaultWorkspaceQuota:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: DefaultWorkspaceQuota sets the ResourceList applied as
                  default quota to each workspace.
                type: object
              jwksCacheFailOpenSeconds:
                description: |-
                  JWKSCacheFailOpenSeconds controls how long the gateway serves cached JWKS on fetch
                  failure. Range [30,600]; 0 = let webhook apply default (300 for shared gateway, 60
                  for dedicated). VAP-enforced range.
                format: int32
                maximum: 600
                minimum: 0
                type: integer
              namespaceSelector:
                description: NamespaceSelector aggregates namespaces by label (Mode
                  A). Ignored in Mode B.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              oidc:
                description: OIDC controls which OIDCProviders are accepted for this
                  tenant.
                properties:
                  allowedProviders:
                    description: |-
                      AllowedProviders lists OIDCProvider names (in authz.keese.ai) accepted for token
                      validation in this tenant. Empty means all configured providers are accepted.
                      Tokens from issuers not in the allow-list are rejected 403 OIDCProviderNotFound.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              security:
                description: Security holds break-glass and transport security overrides.
                properties:
                  allowUnsafeTransports:
                    description: |-
                      AllowUnsafeTransports enables non-TLS transport (break-glass; design 09 cross-cut).
                      Requires namespace label keese.ai/break-glass=true.
                    type: boolean
                type: object
              tokenBudgetRef:
                description: |-
                  TokenBudgetRef references the TokenBudget governing this tenant's aggregate spend.
                  Must resolve when set (webhook-enforced).
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace where the referenced object lives.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - adminSubjects
            type: object
            x-kubernetes-validations:
            - message: adminSubjects must be non-empty
              rule: size(self.adminSubjects) > 0
            - message: jwksCacheFailOpenSeconds must be in [30,600] when set
              rule: '!has(self.jwksCacheFailOpenSeconds) || self.jwksCacheFailOpenSeconds
                == 0 || (self.jwksCacheFailOpenSeconds >= 30 && self.jwksCacheFailOpenSeconds
                <= 600)'
          status:
            description: TenantStatus defines the observed state of Tenant.
            properties:
              capsuleTenantResolved:
                description: |-
                  CapsuleTenantResolved indicates whether the Capsule Tenant named in spec.capsuleTenantRef
                  has been found and is being tracked (Mode B only).
                type: boolean
              conditions:
                description: Conditions reports readiness and provisioning state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the most recent
                  successful reconcile.
                format: date-time
                type: string
              namespaces:
                description: |-
                  Namespaces is the observed namespace list.
                  Mode A: label-derived. Mode B: mirrored from Capsule Tenant.
                items:
                  type: string
                type: array
              observedGeneration:
                description: ObservedGeneration is the last generation successfully
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the lifecycle phase of the tenant.
                enum:
                - Pending
                - Provisioning
                - Active
                - Suspended
                - Terminating
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
