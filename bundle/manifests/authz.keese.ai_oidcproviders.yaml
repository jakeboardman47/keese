apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  creationTimestamp: null
  name: oidcproviders.authz.keese.ai
spec:
  group: authz.keese.ai
  names:
    categories:
    - keese
    kind: OIDCProvider
    listKind: OIDCProviderList
    plural: oidcproviders
    shortNames:
    - oidcp
    singular: oidcprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.issuer
      name: Issuer
      type: string
    - jsonPath: .spec.audienceTemplates[*].name
      name: AudienceTemplates
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OIDCProvider is the Schema for the oidcproviders API.
          OIDCProvider is cluster-scoped and configures OIDC issuer trust for the Envoy AI Gateway
          ext_authz pipeline. Bootstrap CRs (kubernetes-default, google, github-actions, etc.) are
          created by the keese-oidcprovider-bootstrap Job at install time.

          Design: docs/designs/04b-projected-sa-identity.md + docs/designs/04b-ii-oidc-trust.md
          Spec: docs/specs/authz.keese.ai-v1alpha1.md

          tenant.uses_oidc_provider OpenFGA relation: the Tenant controller writes tuples
          (tenant:<name>#uses_oidc_provider@oidc_provider:<spec.oidc.allowedProviders[]>) per
          04a iter-6; this controller owns OIDCProvider CRs only — tuples are written by Tenant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OIDCProviderSpec defines the desired state of OIDCProvider.

              Finalizer:
                - finalizers.oidcprovider.keese.ai/cache-flush
                  Sends cache-flush signal to all gateway pods before allowing CR deletion.

              SSA fieldOwner: keese-oidcprovider-controller

              VAP (ValidatingAdmissionPolicy) enforces:
               1. subjectTemplate parses without error
               2. Every audienceTemplates[].template parses without error
               3. Sprig allow-list: only trimPrefix, trimSuffix, lower, upper, split, replace
               4. audienceTemplates contains at least one entry named "egress"
               5. Every audienceTemplates[].expirationSeconds in [60,600]
            properties:
              audienceTemplates:
                description: |-
                  AudienceTemplates defines the named token-projection audiences for agent pods.
                  Must contain at least one entry named "egress" (VAP-enforced, rule 05.3).
                  Three-token projection paths:
                    egress       → /var/run/keese/tokens/egress      (Envoy AI Gateway ext_authz)
                    supervisor   → /var/run/keese/tokens/supervisor  (ACP bridge, 08b)
                    workflowRun  → /var/run/keese/tokens/workflowRun (NATS bridge, workflow pods only)
                items:
                  description: AudienceTemplate defines a named token-projection audience
                    with its own template and TTL.
                  properties:
                    expirationSeconds:
                      description: |-
                        ExpirationSeconds is the projected ServiceAccount token lifetime. Range [60,600]
                        per rule 05.3. Kubelet rotates the token at 80% of this value.
                      format: int32
                      maximum: 600
                      minimum: 60
                      type: integer
                    name:
                      description: |-
                        Name is the unique identifier for this audience template.
                        At least one entry named "egress" is required in the OIDCProvider (VAP-enforced).
                      minLength: 1
                      type: string
                    template:
                      description: |-
                        Template is a Go template over {.Claims, .Issuer, .Audience} using the restricted
                        Sprig allow-list: trimPrefix, trimSuffix, lower, upper, split, replace.
                        Admission rejects any template referencing a function outside this set.
                      minLength: 1
                      type: string
                  required:
                  - expirationSeconds
                  - name
                  - template
                  type: object
                  x-kubernetes-validations:
                  - message: expirationSeconds must be in [60,600] (rule 05.3 TTL
                      cap)
                    rule: self.expirationSeconds >= 60 && self.expirationSeconds <=
                      600
                minItems: 1
                type: array
              audiences:
                description: Audiences lists glob patterns accepted for the aud claim.
                  E.g. "keese-egress-*".
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              issuer:
                description: |-
                  Issuer is the OIDC issuer URL. JWKS is auto-derived via
                  <issuer>/.well-known/openid-configuration unless jwksUri is set.
                minLength: 1
                pattern: ^https?://
                type: string
              jwksUri:
                description: |-
                  JWKSUri overrides the auto-derived JWKS endpoint. Use for air-gapped clusters,
                  Dex, or Pinniped deployments.
                pattern: ^https?://
                type: string
              normalization:
                description: Normalization controls subject normalization after template
                  rendering.
                properties:
                  lowercase:
                    description: Lowercase converts the rendered subject to lowercase
                      before OpenFGA Check.
                    type: boolean
                  trim:
                    description: Trim strips leading/trailing whitespace from the
                      rendered subject.
                    type: boolean
                type: object
              subjectTemplate:
                description: |-
                  SubjectTemplate is a Go template over {.Claims, .Issuer, .Audience}.
                  Only functions in the Sprig allow-list may be used: trimPrefix, trimSuffix,
                  lower, upper, split, replace. Admission rejects on parse failure.
                minLength: 1
                type: string
            required:
            - audienceTemplates
            - audiences
            - issuer
            - subjectTemplate
            type: object
            x-kubernetes-validations:
            - message: audienceTemplates must contain at least one entry named 'egress'
              rule: self.audienceTemplates.exists(t, t.name == 'egress')
          status:
            description: OIDCProviderStatus defines the observed state of OIDCProvider.
            properties:
              conditions:
                description: Conditions reports Ready and JWKSReachable conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the most recent
                  successful reconcile.
                format: date-time
                type: string
              lastTemplateValidationTime:
                description: |-
                  LastTemplateValidationTime is the UTC timestamp of the most recent successful
                  template parse.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation successfully
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is Active when JWKS is reachable and templates
                  are valid; Degraded otherwise.
                enum:
                - Active
                - Degraded
                type: string
              resolvedJwksUri:
                description: |-
                  ResolvedJWKSUri is the JWKS endpoint the controller most recently used,
                  either copied from spec.jwksUri or derived via OIDC discovery against
                  spec.issuer. Caching it avoids a discovery round-trip on every reconcile.
                  Cleared when the spec changes in a way that invalidates the cache
                  (issuer or jwksUri mutation).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
