                type: integer
              phase:
                description: Phase is the lifecycle phase of the budget.
                enum:
                - Ready
                - Exhausted
                - SoftExhausted
                - ResetFailed
                type: string
              windowEnd:
                description: WindowEnd is the RFC3339 end time of the current accounting
