                properties:
                  tenant:
                    description: Tenant scopes this budget to a named Tenant resource
                      (cluster-level).
                    properties:
                      name:
                        description: Name of the tenant or workspace this budget applies
                          to.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  workspace:
                    description: Workspace scopes this budget to a named Workspace
                      resource (namespace-scoped).
                    properties:
                      name:
                        description: Name of the tenant or workspace this budget applies
                          to.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of tenant or workspace must be set
                  rule: has(self.tenant) != has(self.workspace)
              windowAnchor:
