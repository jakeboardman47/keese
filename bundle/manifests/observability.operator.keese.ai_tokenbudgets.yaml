          spec:
            description: TokenBudgetSpec defines the desired state of TokenBudget.
            properties:
              exhaustionMode:
                default: hard
                description: |-
                  ExhaustionMode controls enforcement on budget crossover: hard (429), soft (warn), disabled.
                  Default: hard.
                enum:
                - hard
                - soft
                - disabled
                type: string
              limits:
                description: |-
                  Limits defines per-model (or aggregate) token caps for this budget.
                  Each entry must set at least one of inputTokens, outputTokens, or totalTokens.
                items:
                  description: TokenLimit defines the token cap per model (or aggregate
                    via model="*").
                  properties:
                    inputTokens:
                      description: InputTokens is the maximum input (prompt) tokens
                        allowed in the window.
                      format: int64
                      minimum: 1
                      type: integer
                    model:
                      description: Model is the upstream model identifier; use "*"
                        for an aggregate cap across all models.
                      minLength: 1
                      type: string
                    outputTokens:
                      description: OutputTokens is the maximum output (completion)
                        tokens allowed in the window.
                      format: int64
                      minimum: 1
                      type: integer
                    totalTokens:
                      description: TotalTokens is the maximum combined token count
                        allowed in the window.
                      format: int64
                      minimum: 1
                      type: integer
                  required:
                  - model
                  type: object
                minItems: 1
                type: array
