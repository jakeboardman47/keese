                  properties:
                    inputTokens:
                      description: InputTokens consumed in the current window.
                      format: int64
                      type: integer
                    model:
                      description: Model is the model identifier.
                      type: string
                    outputTokens:
                      description: OutputTokens consumed in the current window.
                      format: int64
                      type: integer
                    totalTokens:
                      description: TotalTokens consumed in the current window.
                      format: int64
                      type: integer
                  required:
                  - model
                  type: object
                type: array
              consumedPrevious:
                description: |-
                  ConsumedPrevious holds per-model consumption from the previous window,
                  populated on window reset and zeroed when ConsumedCurrent is cleared.
                items:
                  description: TokenUsageEntry records consumed tokens per model (matches
                    TokenLimit shape).
                  properties:
                    inputTokens:
                      description: InputTokens consumed in the current window.
