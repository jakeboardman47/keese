  creationTimestamp: null
  name: sessionstores.keese.ai
spec:
  group: keese.ai
  names:
    categories:
    - keese
    kind: SessionStore
    listKind: SessionStoreList
    plural: sessionstores
    shortNames:
    - ss
    singular: sessionstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.type
      name: Backend
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SessionStore is the Schema for the sessionstores API. It declares where ADK /
          goose runtimes persist structured session + event logs (postgres or sqlite).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SessionStoreSpec is a discriminated one-of over the supported session-store
              backends. Exactly one backend sub-field must be set; enforced by the CEL
              XValidation rule below (mirrors Memory.spec.provider / Transport.spec.type,
              rule 04.6) — NOT a flat struct.
            properties:
              postgres:
                description: postgres configures the PostgreSQL backend (with RLS
                  on tenant_id).
                properties:
                  dsnSecretRef:
                    description: |-
                      dsnSecretRef names a Secret (in this SessionStore's namespace) whose value
                      holds the PostgreSQL DSN / connection string. Mounted as a projected file at
                      /var/run/keese/secrets/dsn, never as an env var (rule 05.7). The DSN must
                      name a NON-superuser role so RLS cannot be bypassed; admission cannot enforce
                      this (see plan E8 risk table).
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  maxConnections:
                    default: 10
                    description: maxConnections bounds the adapter's connection pool
                      to this store.
                    format: int32
                    minimum: 1
                    type: integer
                  sslMode:
                    default: require
                    description: |-
                      sslMode is the libpq sslmode for the connection. Defaults to require so the
                      DSN cannot silently fall back to plaintext.
                    enum:
                    - disable
                    - allow
                    - prefer
                    - require
                    - verify-ca
                    - verify-full
                    type: string
                required:
                - dsnSecretRef
                type: object
              sqlite:
                description: sqlite configures the SQLite-on-PVC backend.
                properties:
                  dbPath:
                    default: sessions.db
                    description: dbPath is the SQLite file path relative to the PVC
                      mount root.
                    minLength: 1
                    type: string
                  pvcRef:
                    description: |-
                      pvcRef names an EXISTING PersistentVolumeClaim (in this SessionStore's
                      namespace) holding the SQLite database file. The store does not provision the
                      PVC; it must already exist.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - pvcRef
                type: object
              type:
                description: type discriminates the active backend sub-field.
                enum:
                - postgres
                - sqlite
                type: string
              workspaceRef:
                description: |-
                  workspaceRef is the owning Workspace name in the same namespace. Binding a
                  session store to a workspace is an authorization decision — the reconciler
                  records it as a ReBAC tuple so ext_authz can gate session reads/writes. The
                  OpenFGA `sessionstore` type/relation does not yet exist in the model; the
                  reconciler uses a no-op writer until rebac-modeler lands the relation
                  (see SUMMARY revisit trigger).
                minLength: 1
                type: string
            required:
            - type
            - workspaceRef
            type: object
            x-kubernetes-validations:
            - message: exactly one of postgres|sqlite must be set (SessionStoreOneBackend)
              rule: '[has(self.postgres),has(self.sqlite)].exists_one(x,x)'
            - message: spec.postgres is required when spec.type=postgres
              rule: self.type != 'postgres' || has(self.postgres)
            - message: spec.sqlite is required when spec.type=sqlite
              rule: self.type != 'sqlite' || has(self.sqlite)
          status:
            description: SessionStoreStatus defines the observed state of a SessionStore.
            properties:
              conditions:
                description: conditions holds standard Kubernetes status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              migrationVersion:
                description: |-
                  migrationVersion is the schema version last applied to the backend. Gates the
                  PG migration: the reconciler skips the (idempotent) migration when this is
                  already current, so migration is not re-run on every reconcile.
                type: string
              observedGeneration:
                description: observedGeneration is the .metadata.generation the controller
                  last reconciled.
                format: int64
                type: integer
              phase:
                description: phase is the current lifecycle phase.
                enum:
                - Pending
                - Migrating
                - Ready
                - Degraded
                - Terminating
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
