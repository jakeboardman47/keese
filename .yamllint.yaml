extends: default

rules:
  line-length:
    max: 160
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false
  comments:
    require-starting-space: true
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  # Kustomize + Helm templates often have long keys; allow.
  key-duplicates: enable
  empty-lines:
    max: 2
  new-lines:
    type: unix

ignore: |
  .secrets.baseline
  charts/**
  **/zz_generated*
  # operator-sdk generator outputs below — formatting controlled by the
  # upstream generator; treat as generated rather than handwritten YAML.
  bundle/**
  config/**
